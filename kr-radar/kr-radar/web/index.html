<title>버거대왕의 국장 레이더</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* 레이아웃 개념: 하늘과 성(히어로) 아래 펼쳐진 양피지 칙서. 왕관·리본·금화 = 점수와 등급 */
:root{
  --sky-top:#4fb0ee; --sky-bot:#d5f0ff; --cloud:#ffffff; --castle-far:#9cc0de; --castle-near:#6f98c0; --window:#ffe7a3;
  --paper:#fbf4e4; --paper-2:#f4e6c8; --card:#fffaf0; --line:#e6d3a8;
  --ink:#3a2413; --ink-soft:#7b5b3d; --ink-faint:#a88d6c;
  --gold:#e3a82b; --gold-hi:#ffd66b; --gold-deep:#a8700d;
  --red:#c3172e; --red-soft:#f7d9dc; --navy:#1d2d5c; --navy-soft:#dde4f5;
  --up:#d42a3a; --down:#1f5fbf;
  --ok:#23804f; --ok-soft:#dcf1e4; --warn:#b86e00; --warn-soft:#fbead0; --bad:#c3172e; --bad-soft:#f9dade; --unk:#7d7466; --unk-soft:#ece6db;
  --cloud-up:rgba(35,128,79,.16); --cloud-dn:rgba(195,23,46,.14);
  --shadow:0 1px 0 rgba(58,36,19,.06),0 6px 18px -8px rgba(58,36,19,.25);
  --f-display:"Black Han Sans","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --sky-top:#070d26; --sky-bot:#22336b; --cloud:#3b4c86; --castle-far:#1c2757; --castle-near:#10173a; --window:#ffcf5a;
  --paper:#12172a; --paper-2:#1a2139; --card:#1a2038; --line:#2d3657;
  --ink:#f3e8d0; --ink-soft:#c2b393; --ink-faint:#8b8069;
  --gold:#f0bd48; --gold-hi:#ffe08a; --gold-deep:#f5c75a;
  --red:#ff5a6a; --red-soft:#3d1c26; --navy:#a9bcff; --navy-soft:#232d52;
  --up:#ff5d6b; --down:#62a0ff;
  --ok:#52c98d; --ok-soft:#173327; --warn:#f2b54a; --warn-soft:#3a2c14; --bad:#ff5d6b; --bad-soft:#3d1c26; --unk:#9a96a8; --unk-soft:#262a3c;
  --cloud-up:rgba(82,201,141,.16); --cloud-dn:rgba(255,93,107,.14);
  --shadow:0 1px 0 rgba(0,0,0,.3),0 8px 22px -10px rgba(0,0,0,.7);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --sky-top:#070d26; --sky-bot:#22336b; --cloud:#3b4c86; --castle-far:#1c2757; --castle-near:#10173a; --window:#ffcf5a;
  --paper:#12172a; --paper-2:#1a2139; --card:#1a2038; --line:#2d3657;
  --ink:#f3e8d0; --ink-soft:#c2b393; --ink-faint:#8b8069;
  --gold:#f0bd48; --gold-hi:#ffe08a; --gold-deep:#f5c75a;
  --red:#ff5a6a; --red-soft:#3d1c26; --navy:#a9bcff; --navy-soft:#232d52;
  --up:#ff5d6b; --down:#62a0ff;
  --ok:#52c98d; --ok-soft:#173327; --warn:#f2b54a; --warn-soft:#3a2c14; --bad:#ff5d6b; --bad-soft:#3d1c26; --unk:#9a96a8; --unk-soft:#262a3c;
  --cloud-up:rgba(82,201,141,.16); --cloud-dn:rgba(255,93,107,.14);
  --shadow:0 1px 0 rgba(0,0,0,.3),0 8px 22px -10px rgba(0,0,0,.7);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.6 var(--f-body);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit}
a{color:var(--red)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:6px}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.up{color:var(--up)} .down{color:var(--down)}
h1,h2,h3{text-wrap:balance}

/* ── 상단 바 ── */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(8px);border-bottom:2px solid var(--gold)}
.bar .wrap{display:flex;align-items:center;gap:12px;min-height:56px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink);font-family:var(--f-display);font-size:19px;letter-spacing:.01em;margin-right:auto}
.brand svg{width:30px;height:24px}
.nav{display:flex;gap:4px}
.nav a{padding:6px 12px;border-radius:999px;text-decoration:none;color:var(--ink-soft);font-weight:700;font-size:14px}
.nav a[aria-current="page"]{background:var(--navy);color:var(--paper)}
:root[data-theme="dark"] .nav a[aria-current="page"]{color:#12172a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .nav a[aria-current="page"]{color:#12172a}}
.theme-btn{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 10px;cursor:pointer;font-size:13px}

/* ── 히어로: 하늘과 성 ── */
.hero{position:relative;overflow:hidden;background:linear-gradient(180deg,var(--sky-top),var(--sky-bot));padding-block:36px 0}
.hero .stars{position:absolute;inset:0;opacity:0;pointer-events:none;background-image:radial-gradient(1.4px 1.4px at 12% 18%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 28% 32%,#fff 50%,transparent 51%),radial-gradient(1.6px 1.6px at 47% 12%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 63% 26%,#fff 50%,transparent 51%),radial-gradient(1.3px 1.3px at 81% 14%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 91% 38%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 6% 44%,#fff 50%,transparent 51%)}
:root[data-theme="dark"] .hero .stars{opacity:.85}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .hero .stars{opacity:.85}}
.cloud{position:absolute;background:var(--cloud);border-radius:999px;opacity:.9;filter:blur(.3px)}
.cloud::before,.cloud::after{content:"";position:absolute;background:inherit;border-radius:50%}
.cloud.c1{width:170px;height:44px;top:40px;left:4%;animation:drift 70s linear infinite}
.cloud.c1::before{width:80px;height:70px;left:24px;top:-34px}.cloud.c1::after{width:64px;height:54px;left:84px;top:-22px}
.cloud.c2{width:120px;height:32px;top:96px;left:58%;opacity:.75;animation:drift 95s linear infinite reverse}
.cloud.c2::before{width:56px;height:50px;left:18px;top:-24px}.cloud.c2::after{width:44px;height:38px;left:60px;top:-16px}
.cloud.c3{width:210px;height:50px;top:24px;right:-40px;opacity:.85;animation:drift 110s linear infinite}
.cloud.c3::before{width:96px;height:84px;left:30px;top:-40px}.cloud.c3::after{width:76px;height:62px;left:110px;top:-26px}
@keyframes drift{from{transform:translateX(0)}50%{transform:translateX(60px)}to{transform:translateX(0)}}
@media (prefers-reduced-motion:reduce){.cloud{animation:none!important}}
.hero-grid{position:relative;z-index:2;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:28px;align-items:end}
.hero-copy{padding-bottom:64px;min-width:0}
.ribbon{display:inline-block;position:relative;background:var(--red);color:#fff;font-weight:700;font-size:13px;letter-spacing:.08em;padding:5px 18px;margin-bottom:12px;box-shadow:0 2px 0 rgba(0,0,0,.18)}
.ribbon::before,.ribbon::after{content:"";position:absolute;top:0;border:14px solid var(--red);border-color:var(--red) transparent;filter:brightness(.8)}
.ribbon::before{left:-14px;border-left-color:transparent;border-width:14px 0 14px 14px;border-color:var(--red) var(--red) var(--red) transparent}
.ribbon::after{right:-14px;border-width:14px 14px 14px 0;border-color:var(--red) transparent var(--red) var(--red)}
.title{margin:0;font-family:var(--f-display);font-weight:400;font-size:clamp(40px,7.4vw,84px);line-height:1.02;color:var(--red);letter-spacing:-.01em;
  -webkit-text-stroke:2px #fff;paint-order:stroke fill;text-shadow:0 4px 0 #7a1020,0 8px 18px rgba(0,0,0,.25)}
.title .sub{display:block;font-size:.5em;color:#fff;-webkit-text-stroke:0;text-shadow:0 3px 0 rgba(29,45,92,.55)}
.lede{max-width:34em;margin:14px 0 18px;color:#10254d;font-weight:500}
:root[data-theme="dark"] .lede{color:#dbe4ff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .lede{color:#dbe4ff}}
.hero-stats{display:flex;flex-wrap:wrap;gap:10px}
.stat{background:color-mix(in srgb,var(--card) 88%,transparent);border:2px solid var(--gold);border-radius:14px;padding:8px 14px;min-width:112px;box-shadow:var(--shadow)}
.stat b{display:block;font-family:var(--f-num);font-size:24px;line-height:1.1;color:var(--ink)}
.stat span{font-size:12px;color:var(--ink-soft);letter-spacing:.03em}
.portrait{position:relative;margin:0 0 56px;justify-self:end;width:min(100%,430px)}
.frame{display:block;width:100%;padding:12px;border:0;cursor:zoom-in;border-radius:22px;
  background:linear-gradient(145deg,var(--gold-hi),var(--gold) 40%,var(--gold-deep) 70%,var(--gold-hi));box-shadow:0 18px 40px -16px rgba(0,0,0,.55),inset 0 0 0 2px rgba(255,255,255,.5)}
.frame img{display:block;width:100%;height:auto;max-width:100%;aspect-ratio:1/1;object-fit:contain;border-radius:12px;background:#f7efe0;border:3px solid #7a4d0c}
.portrait figcaption{text-align:center;font-size:12px;margin-top:8px;color:#10254d;font-weight:700;letter-spacing:.04em}
:root[data-theme="dark"] .portrait figcaption{color:#dbe4ff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .portrait figcaption{color:#dbe4ff}}
.castle{position:absolute;left:0;right:0;bottom:-1px;height:120px;z-index:1;width:100%}
.castle .far{fill:var(--castle-far)} .castle .near{fill:var(--castle-near)} .castle .win{fill:var(--window)} .castle .ground{fill:var(--paper)} .castle .flag{fill:var(--red)}
@media (max-width:820px){.hero-grid{grid-template-columns:1fr}.hero-copy{padding-bottom:8px}.portrait{justify-self:center;margin-bottom:96px}}

.demo-banner{margin-bottom:18px;background:var(--warn-soft);color:var(--warn);border:1px dashed var(--warn);border-radius:12px;padding:10px 14px;font-weight:700;margin-top:18px}

/* ── 섹션 공통 ── */
main{padding-block:22px 56px}
.view{display:grid;gap:18px}
.sec-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.sec-head h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:28px;color:var(--ink)}
.sec-head p{margin:0;color:var(--ink-soft);font-size:14px}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--gold-deep);font-weight:700}

/* 필터 */
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--paper-2);border:1px solid var(--line);border-radius:16px;padding:12px}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:none;padding:5px 12px;border-radius:999px;cursor:pointer;font-size:13px;font-weight:700;color:var(--ink-soft)}
.seg button[aria-pressed="true"]{background:var(--gold);color:#3a2413}
.filters input[type=search],.filters select{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;font:inherit;font-size:14px;color:var(--ink);min-width:0}
.filters input[type=search]{flex:1 1 180px}
.toggle{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;cursor:pointer;user-select:none}
.toggle input{accent-color:var(--red);width:16px;height:16px}
.regime-pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:700;cursor:pointer;color:var(--ink-soft)}
.pill[aria-pressed="true"]{border-color:var(--navy);background:var(--navy);color:var(--paper)}
.count-line{font-size:13px;color:var(--ink-soft)}

/* 종목 카드 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{display:grid;gap:10px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;cursor:pointer;box-shadow:var(--shadow);transition:transform .15s,border-color .15s;min-width:0}
.card:hover{transform:translateY(-2px);border-color:var(--gold)}
.card-top{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:start}
.rank{font-family:var(--f-num);font-size:12px;color:var(--ink-faint);padding-top:3px;min-width:2.4em}
.nm b{display:block;font-size:17px;line-height:1.25;overflow-wrap:anywhere}
.nm small{color:var(--ink-soft);font-size:12px}
.px{text-align:right;font-family:var(--f-num);font-size:14px;line-height:1.3}
.px small{display:block;font-size:12px}
.regime{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;border-radius:8px;padding:3px 9px;justify-self:start}
.rg-uptrend_pullback{background:color-mix(in srgb,var(--gold) 24%,transparent);color:var(--gold-deep)}
.rg-reversal{background:var(--ok-soft);color:var(--ok)}
.rg-uptrend{background:var(--navy-soft);color:var(--navy)}
.rg-sideways{background:var(--unk-soft);color:var(--unk)}
.rg-downtrend{background:var(--bad-soft);color:var(--bad)}
.rg-pending{background:var(--unk-soft);color:var(--unk)}
.chips{display:flex;flex-wrap:wrap;gap:5px;min-height:24px}
.chip{font-size:11.5px;font-weight:700;border-radius:6px;padding:2px 7px;border:1px solid}
.g-bounce{color:var(--gold-deep);border-color:color-mix(in srgb,var(--gold) 60%,transparent);background:color-mix(in srgb,var(--gold) 12%,transparent)}
.g-oversold{color:var(--navy);border-color:color-mix(in srgb,var(--navy) 40%,transparent);background:var(--navy-soft)}
.g-breakout{color:var(--red);border-color:color-mix(in srgb,var(--red) 40%,transparent);background:var(--red-soft)}
.chip.none{color:var(--ink-faint);border-color:var(--line);background:none;font-weight:500}
.score-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center}
.meter{position:relative;height:10px;border-radius:999px;background:var(--paper-2);border:1px solid var(--line);overflow:hidden}
.meter span{position:absolute;inset:0 auto 0 0;border-radius:999px;background:linear-gradient(90deg,var(--gold-deep),var(--gold),var(--gold-hi))}
.meter-label{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-soft);margin-bottom:4px}
.meter-label b{font-family:var(--f-num);color:var(--ink);font-size:13px}
.coin{display:grid;place-items:center;width:52px;height:52px;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--gold-hi),var(--gold) 55%,var(--gold-deep));color:#3a2413;box-shadow:inset 0 0 0 3px rgba(255,255,255,.35),0 3px 8px -3px rgba(0,0,0,.4);text-align:center;line-height:1}
.coin b{font-family:var(--f-num);font-size:18px}
.coin small{display:block;font-size:9.5px;font-weight:700;letter-spacing:.04em}
.more{justify-self:center;border:2px solid var(--gold);background:var(--card);border-radius:999px;padding:9px 22px;font-weight:700;cursor:pointer}
.empty{padding:28px;text-align:center;color:var(--ink-soft);border:1px dashed var(--line);border-radius:16px}

/* ── 상세 ── */
.back{border:0;background:none;color:var(--ink-soft);cursor:pointer;font-weight:700;padding:4px 0;justify-self:start}
.d-head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:end;border-bottom:2px solid var(--gold);padding-bottom:14px}
.d-head h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:clamp(30px,5vw,44px);line-height:1.05}
.d-meta{color:var(--ink-soft);font-size:13.5px;display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:6px}
.d-price{text-align:right;font-family:var(--f-num);font-size:26px;line-height:1.1}
.d-price small{display:block;font-size:14px}
.medals{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.medal{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:grid;gap:2px;min-width:0}
.medal span{font-size:12px;color:var(--ink-soft);font-weight:700;letter-spacing:.03em}
.medal b{font-family:var(--f-num);font-size:26px;line-height:1.1}
.medal small{font-size:11.5px;color:var(--ink-faint)}
.medal.total{background:linear-gradient(160deg,color-mix(in srgb,var(--gold) 30%,var(--card)),var(--card));border:2px solid var(--gold)}
@media (max-width:640px){.medals{grid-template-columns:repeat(2,minmax(0,1fr))}.d-head{grid-template-columns:1fr}.d-price{text-align:left}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;min-width:0}
.panel h3{margin:0 0 10px;font-size:17px}
.chart-box{position:relative}
.chart-box canvas{display:block;width:100%;height:360px;touch-action:pan-y}
@media (max-width:640px){.chart-box canvas{height:290px}}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink-soft);margin-top:8px}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
.legend i.box{height:10px;width:12px}
.tip{position:absolute;pointer-events:none;background:var(--paper);border:1px solid var(--gold);border-radius:10px;padding:6px 9px;font-size:12px;line-height:1.45;box-shadow:var(--shadow);min-width:150px;z-index:3}
.tip b{font-family:var(--f-num)}
.two{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px}
@media (max-width:860px){.two{grid-template-columns:1fr}}
.sig-group{display:grid;gap:6px;margin-bottom:12px}
.sig-group h4{margin:0;font-size:12.5px;letter-spacing:.06em;color:var(--ink-soft)}
.sig{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:8px;align-items:start;padding:7px 9px;border-radius:10px;border:1px solid var(--line)}
.sig.hit{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 10%,transparent)}
.sig .mk{font-weight:700;text-align:center}
.sig.hit .mk{color:var(--gold-deep)} .sig:not(.hit){opacity:.72}
.sig .t b{font-size:14px}
.sig .t small{display:block;color:var(--ink-soft);font-size:12px;line-height:1.45}
.sig .p{font-family:var(--f-num);font-size:13px;white-space:nowrap}
.regime-card{border-radius:14px;padding:14px;display:grid;gap:6px}
.regime-card h4{margin:0;font-size:20px;font-family:var(--f-display);font-weight:400}
.regime-card ul{margin:0;padding-left:18px;font-size:13px}
.kv{display:grid;grid-template-columns:auto auto;gap:4px 14px;font-size:13px;margin-top:10px}
.kv dt{color:var(--ink-soft)} .kv dd{margin:0;text-align:right;font-family:var(--f-num)}
.calc{font-size:12.5px;color:var(--ink-soft);border-top:1px dashed var(--line);padding-top:8px;margin-top:6px}

/* 페이지 넘김 (1/2 재무 → 2/2 악재) */
.pager{display:grid;grid-template-columns:1fr 1fr;border:2px solid var(--gold);border-radius:16px;overflow:hidden}
.pager button{border:0;background:var(--card);padding:12px 10px;cursor:pointer;display:grid;gap:0;text-align:left;padding-left:16px}
.pager button span{font-size:12px;color:var(--ink-soft);font-weight:700;letter-spacing:.05em}
.pager button b{font-size:17px}
.pager button[aria-current="step"]{background:var(--gold);color:#3a2413}
.pager button[aria-current="step"] span{color:#5b3b0c}
.page-foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.btn{border:2px solid var(--gold);background:var(--card);border-radius:999px;padding:9px 18px;font-weight:700;cursor:pointer}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff}

.score-hero{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center}
.shield{width:92px;height:104px;display:grid;place-items:center;position:relative}
.shield svg{position:absolute;inset:0;width:100%;height:100%}
.shield .sv{position:relative;text-align:center;line-height:1;color:#3a2413}
.shield .sv b{font-family:var(--f-num);font-size:30px;display:block}
.shield .sv small{font-size:12px;font-weight:700}
.score-hero p{margin:0;color:var(--ink-soft);font-size:14px}

.items{display:grid;gap:8px}

.search-box input{width:100%;font:inherit;font-size:20px;padding:14px 20px 14px 50px;border-radius:999px;border:3px solid var(--gold);background:var(--card);color:var(--ink)}
.search-box svg{position:absolute;left:18px;top:50%;transform:translateY(-50%);width:22px;height:22px;color:var(--gold-deep)}

.sugg li{padding:8px 12px;border-radius:10px;cursor:pointer;display:flex;justify-content:space-between;gap:10px}

.sugg small{color:var(--ink-soft)}

@media (max-width:640px){.verdict{grid-template-columns:1fr;justify-items:start}}
.big-coin{width:150px;height:150px;border-radius:50%;display:grid;place-items:center;text-align:center;background:radial-gradient(circle at 35% 28%,var(--gold-hi),var(--gold) 55%,var(--gold-deep));color:#3a2413;box-shadow:inset 0 0 0 6px rgba(255,255,255,.35),inset 0 0 0 10px rgba(122,77,12,.35),0 14px 30px -12px rgba(0,0,0,.5);line-height:1}

<script>
(function(){
"use strict";
const R = window.RADAR || {meta:{}, stocks:[]};
const M = R.meta, S = R.stocks;
const byCode = Object.fromEntries(S.map(s=>[s.code,s]));
const $ = (s,el=document)=>el.querySelector(s);
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const SM = M.signal_meta || {};
const FT = M.fin_text || {}, RT = M.risk_text || {};
S.forEach(s=>{ (s.fin?.items||[]).forEach(i=>{ i.explain=FT[i.key]?.explain||""; if(i.status==="ok") i.rule=FT[i.key]?.rule||""; });
               (s.risk?.items||[]).forEach(i=>{ i.explain=RT[i.key]||""; }); });
/* 종목별 캔들차트 파일 불러오기 (c/코드.js) */
const chartCache=window.__CHARTS||{}, chartWait={};
window.__chart=(code,data)=>{ chartCache[code]=data; (chartWait[code]||[]).forEach(f=>f(data)); delete chartWait[code]; };
function loadChart(code,cb){
  if(chartCache[code]) return cb(chartCache[code]);
  if(chartWait[code]){ chartWait[code].push(cb); return; }
  chartWait[code]=[cb];
  const sc=document.createElement("script"); sc.src="c/"+code+".js";
  sc.onerror=()=>{ (chartWait[code]||[]).forEach(f=>f(null)); delete chartWait[code]; };
  document.head.appendChild(sc);
}
const REGIMES = {
  uptrend_pullback:["상승추세 눌림목","👑"], reversal:["추세전환 시도","🔄"], uptrend:["상승추세","📈"],
  sideways:["횡보","➖"], downtrend:["하락추세","⚠️"], pending:["판정 유보","⏸"]
};
const GROUP_NAME = {bounce:"반등 신호", oversold:"과매도 위치", breakout:"돌파 신호"};

/* ── 숫자 표시 ── */
const won = v => v==null? "–" : Math.round(v).toLocaleString("ko-KR");
const pct = (v,d=1) => v==null? "–" : (v>0?"+":"")+v.toFixed(d)+"%";
const eok = v => { if(v==null) return "–"; if(v>=10000) return (v/10000).toFixed(v>=100000?0:1)+"조"; return Math.round(v).toLocaleString("ko-KR")+"억"; };
const cls = v => v==null? "" : v>0? "up" : v<0? "down" : "";
const sc = v => v==null? "–" : Math.round(v);

/* ── 초성 검색 ── */
const CHO = "ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ";
const chosung = s => [...s].map(ch=>{const c=ch.charCodeAt(0)-0xAC00; return (c>=0&&c<11172)? CHO[Math.floor(c/588)] : ch;}).join("");
S.forEach(s=>{ s._cho = chosung(s.name); s._lc = s.name.toLowerCase(); });
function matches(s,q){
  q=q.trim().toLowerCase(); if(!q) return true;
  if(/^[ㄱ-ㅎ]+$/.test(q)) return s._cho.includes(q);
  return s._lc.includes(q) || s.code.toLowerCase().startsWith(q);
}
function search(q,limit=8){
  q=q.trim(); if(!q) return [];
  const out=S.filter(s=>matches(s,q));
  const lq=q.toLowerCase();
  out.sort((a,b)=>(b._lc.startsWith(lq)||b.code.startsWith(lq))-(a._lc.startsWith(lq)||a.code.startsWith(lq)) || (b.marcap||0)-(a.marcap||0));
  return out.slice(0,limit);
}

/* ── 점수 도우미 ── */
const chartScore = s => s.chart? s.chart.score : null;
const finScore = s => s.fin? s.fin.score : null;
const riskScore = s => s.risk? s.risk.score : null;
const totalScore = s => s.total? s.total.score : null;
function verdict(t){
  if(t==null) return "데이터가 모자라 판결을 내릴 수 없노라";
  if(t>=80) return "짐이 보증하노라! 아주 맛있게 익은 자리로다";
  if(t>=65) return "제법 먹음직스럽구나. 눈여겨보거라";
  if(t>=50) return "간이 덜 배었도다. 조금 더 지켜보자꾸나";
  if(t>=35) return "아직 설익었노라. 서두르지 말거라";
  return "이건 왕의 식탁에 올릴 수 없도다";
}

/* ── 테마 ── */
const root=document.documentElement;
function isDark(){ const t=root.getAttribute("data-theme"); return t? t==="dark" : matchMedia("(prefers-color-scheme: dark)").matches; }
function syncThemeBtn(){ $("#themeBtn").textContent = isDark()? "☀️ 낮" : "🌙 밤"; }
$("#themeBtn").addEventListener("click",()=>{ root.setAttribute("data-theme", isDark()? "light":"dark"); try{localStorage.setItem("bk-theme",root.getAttribute("data-theme"))}catch(e){} syncThemeBtn(); redrawCharts(); });
try{ const t=localStorage.getItem("bk-theme"); if(t) root.setAttribute("data-theme",t);}catch(e){}
syncThemeBtn();
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change",()=>{syncThemeBtn();redrawCharts();});

/* ── 초상화 ── */
$("#portraitBtn").addEventListener("click",()=>{ const d=$("#portraitDlg"); if(d.showModal) d.showModal(); });

/* ── 히어로 통계 ── */
function heroStats(){
  const cnt = {}; S.forEach(s=>{ const k=s.chart?.regime?.key; if(k) cnt[k]=(cnt[k]||0)+1; });
  $("#heroStats").innerHTML = `
    <div class="stat"><b>${S.length}</b><span>레이팅 종목</span></div>
    <div class="stat"><b>${M.signals??0}</b><span>시그널 발생</span></div>
    <div class="stat"><b>${cnt.uptrend_pullback||0}</b><span>상승추세 눌림목</span></div>
    <div class="stat"><b>${esc((M.as_of||"").slice(5).replace("-","/"))||"–"}</b><span>기준일 종가</span></div>`;
  if(M.mode==="demo"){
    const b=$("#demoBanner"); b.hidden=false; b.className="demo-banner";
    b.textContent="샘플 화면입니다. 종목 이름·가격·재무는 모두 지어낸 가상 데이터예요. 실제 350종목 데이터는 GitHub에서 매일 자동 실행될 때 채워집니다.";
  }
  $("#asOf").textContent = `${M.as_of||""} 종가 기준 · ${M.generated||""} 갱신 · 최근 ${M.lookback||5}거래일 안에 뜬 신호만 점수에 반영`;
}

/* ── ① 레이팅 목록 ── */
const st = {mkt:"all", regime:"all", only:true, sort:"chart", q:"", shown:48};
try{ Object.assign(st, JSON.parse(localStorage.getItem("bk-filter")||"{}"), {shown:48}); }catch(e){}
function saveSt(){ try{localStorage.setItem("bk-filter",JSON.stringify({mkt:st.mkt,regime:st.regime,only:st.only,sort:st.sort}))}catch(e){} }

function regimePills(){
  const cnt={all:S.length}; S.forEach(s=>{const k=s.chart?.regime?.key; if(k) cnt[k]=(cnt[k]||0)+1;});
  const keys=["all","uptrend_pullback","reversal","uptrend","sideways","downtrend","pending"];
  $("#regimePills").innerHTML = keys.map(k=>`<button type="button" class="pill" data-v="${k}" aria-pressed="${st.regime===k}">${k==="all"?"모든 국면":REGIMES[k][1]+" "+REGIMES[k][0]} ${cnt[k]||0}</button>`).join("");
}
function sortVal(s){
  switch(st.sort){
    case "total": return totalScore(s); case "fin": return finScore(s); case "risk": return riskScore(s);
    case "chg": return s.chart?.stats?.chg; case "marcap": return s.marcap; default: return chartScore(s);
  }
}
function filtered(){
  let a=S.filter(s=> (st.mkt==="all"||s.market===st.mkt)
    && (st.regime==="all"||s.chart?.regime?.key===st.regime)
    && (!st.only || s.chart?.is_signal)
    && matches(s,st.q));
  a.sort((x,y)=>{ const vx=sortVal(x), vy=sortVal(y); if(vx==null&&vy==null) return 0; if(vx==null) return 1; if(vy==null) return -1; return vy-vx || (totalScore(y)||0)-(totalScore(x)||0); });

/* ── 캔들차트 (캔버스) ── */
const liveCharts=[];
function cssv(n){ return getComputedStyle(root).getPropertyValue(n).trim(); }
function drawChart(cv, ch, hover){
  const dpr=window.devicePixelRatio||1, W=cv.clientWidth, H=cv.clientHeight;
  if(!W||!H) return;
  cv.width=W*dpr; cv.height=H*dpr;
  const g=cv.getContext("2d"); g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,W,H);
  const n=ch.c.length, total=ch.sa.length, padL=6, padR=62, padT=10, volH=Math.round(H*0.16), dateH=18;
  const priceB=H-volH-dateH-8;
  const xw=(W-padL-padR)/total, X=i=>padL+(i+.5)*xw;
  let lo=Infinity, hi=-Infinity;
  for(let i=0;i<n;i++){ lo=Math.min(lo,ch.l[i]); hi=Math.max(hi,ch.h[i]); }
  const pad=(hi-lo)*0.08;
  const inR=v=>v!=null && v>lo-(hi-lo)*0.35 && v<hi+(hi-lo)*0.35;
  [ch.ma20,ch.ma60,ch.ma120,ch.sa,ch.sb].forEach(arr=>arr.forEach(v=>{ if(inR(v)){lo=Math.min(lo,v);hi=Math.max(hi,v);} }));
  if(ch.fib) Object.values(ch.fib).forEach(v=>{ if(inR(v)){lo=Math.min(lo,v);hi=Math.max(hi,v);} });
  lo-=pad; hi+=pad;
  const Y=v=>padT+(hi-v)/(hi-lo)*(priceB-padT);
  const ink=cssv("--ink-soft"), faint=cssv("--line"), up=cssv("--up"), dn=cssv("--down");
  g.font="11px "+cssv("--f-num"); g.textBaseline="middle";
  // 가격 격자
  const step=niceStep((hi-lo)/5);
  g.strokeStyle=faint; g.lineWidth=1; g.fillStyle=ink; g.textAlign="left";
  for(let v=Math.ceil(lo/step)*step; v<hi; v+=step){ const y=Math.round(Y(v))+.5; g.beginPath(); g.moveTo(padL,y); g.lineTo(W-padR,y); g.stroke(); g.fillText(won(v),W-padR+6,y); }
  // 구름대
  for(let i=1;i<total;i++){
    const a0=ch.sa[i-1],b0=ch.sb[i-1],a1=ch.sa[i],b1=ch.sb[i];
    if([a0,b0,a1,b1].some(v=>v==null)) continue;
    g.fillStyle = (a1>=b1)? cssv("--cloud-up") : cssv("--cloud-dn");
    g.beginPath(); g.moveTo(X(i-1),Y(a0)); g.lineTo(X(i),Y(a1)); g.lineTo(X(i),Y(b1)); g.lineTo(X(i-1),Y(b0)); g.closePath(); g.fill();
  }
  // 오늘 이후(미래 구름) 구분선
  g.setLineDash([2,3]); g.strokeStyle=faint; g.beginPath(); g.moveTo(X(n-1)+xw/2,padT); g.lineTo(X(n-1)+xw/2,priceB); g.stroke(); g.setLineDash([]);
  // 피보나치
  if(ch.fib){
    g.setLineDash([5,4]); g.lineWidth=1;
    [["0.382","38.2%"],["0.5","50%"],["0.618","61.8%"]].forEach(([k,lab])=>{ const v=ch.fib[k]; if(v==null||v<lo||v>hi) return; const y=Math.round(Y(v))+.5;
      g.strokeStyle=cssv("--navy"); g.globalAlpha=.55; g.beginPath(); g.moveTo(padL,y); g.lineTo(X(n-1),y); g.stroke(); g.globalAlpha=1;
      g.fillStyle=cssv("--navy"); g.textAlign="left"; g.fillText("Fib "+lab,padL+4,y-7); });
    g.setLineDash([]);
  }
  // 이평선
  const line=(arr,color,w)=>{ g.strokeStyle=color; g.lineWidth=w; g.beginPath(); let on=false; for(let i=0;i<n;i++){ const v=arr[i]; if(v==null){on=false;continue;} const x=X(i),y=Y(v); on? g.lineTo(x,y) : g.moveTo(x,y); on=true; } g.stroke(); };
  line(ch.ma120,cssv("--navy"),1.6); line(ch.ma60,cssv("--red"),1.4); line(ch.ma20,cssv("--gold"),1.8);
  // 캔들 (국장 관례: 양봉 빨강, 음봉 파랑)
  const bw=Math.max(1,Math.min(9,xw*0.68));
  for(let i=0;i<n;i++){
    const o=ch.o[i],c=ch.c[i],h=ch.h[i],l=ch.l[i], isUp=c>=o, col=isUp?up:dn, x=X(i);
    g.strokeStyle=col; g.fillStyle=col; g.lineWidth=1;
    g.beginPath(); g.moveTo(Math.round(x)+.5,Y(h)); g.lineTo(Math.round(x)+.5,Y(l)); g.stroke();
    const y1=Y(Math.max(o,c)), y2=Y(Math.min(o,c)), hh=Math.max(1,y2-y1);
    if(isUp){ g.fillRect(x-bw/2,y1,bw,hh); } else { g.fillRect(x-bw/2,y1,bw,hh); }
  }
  // 거래량
  const vmax=Math.max(...ch.v,1), vTop=priceB+8;
  for(let i=0;i<n;i++){ const h=ch.v[i]/vmax*(volH-2); g.fillStyle=(ch.c[i]>=ch.o[i])?up:dn; g.globalAlpha=.45; g.fillRect(X(i)-bw/2,vTop+volH-h,bw,h); }
  g.globalAlpha=1;
  // 신호 표시 (왕관 핀)
  const byI={}; (ch.marks||[]).forEach(m=>{(byI[m.i]=byI[m.i]||[]).push(m.k);});
  Object.keys(byI).forEach(i=>{ i=+i; const x=X(i), y=Y(ch.l[i])+10; crownPin(g,x,Math.min(y,priceB-6)); });
  // 날짜
  g.fillStyle=ink; g.textAlign="center";
  const every=Math.max(1,Math.round(n/6));
  for(let i=n-1;i>=0;i-=every){ const d=ch.d[i]; g.fillText(d.slice(2,4)+"/"+d.slice(4,6),X(i),H-8); }
  // 마우스 위치
  if(hover!=null && hover>=0 && hover<n){
    g.strokeStyle=cssv("--ink-faint"); g.setLineDash([3,3]); g.beginPath(); g.moveTo(X(hover),padT); g.lineTo(X(hover),H-dateH); g.stroke(); g.setLineDash([]);
  }
  cv._geo={X,xw,padL,n,total};
  return byI;
}
function crownPin(g,x,y){
  g.save(); g.translate(x,y);
  g.fillStyle=cssv("--gold"); g.strokeStyle=cssv("--gold-deep"); g.lineWidth=1;
  g.beginPath(); g.moveTo(-6,5); g.lineTo(-6,-2); g.lineTo(-3,1); g.lineTo(0,-5); g.lineTo(3,1); g.lineTo(6,-2); g.lineTo(6,5); g.closePath(); g.fill(); g.stroke();
  g.restore();
}
function niceStep(x){ const p=Math.pow(10,Math.floor(Math.log10(x))); const f=x/p; return (f<1.5?1:f<3?2:f<7?5:10)*p; }
function mountChart(box, ch){
  const cv=box.querySelector("canvas"), tip=box.querySelector(".tip");
  let byI=drawChart(cv,ch,null)||{};
  const obj={cv,ch,draw:h=>{byI=drawChart(cv,ch,h)||{};}};
  liveCharts.push(obj);
  function at(ev){
    const r=cv.getBoundingClientRect(), gx=cv._geo; if(!gx) return;
    const i=Math.round((ev.clientX-r.left-gx.padL)/gx.xw-.5);
    if(i<0||i>=gx.n){ tip.hidden=true; obj.draw(null); return; }
    obj.draw(i);
    const o=ch.o[i],h=ch.h[i],l=ch.l[i],c=ch.c[i], prev=i>0?ch.c[i-1]:null, chg=prev?(c/prev-1)*100:null;
    const d=ch.d[i], sig=(byI[i]||[]).map(k=>SM[k]?.name).filter(Boolean);
    tip.innerHTML=`<div>20${d.slice(0,2)}.${d.slice(2,4)}.${d.slice(4,6)}</div>
      <div>시 <b>${won(o)}</b> · 고 <b>${won(h)}</b></div><div>저 <b>${won(l)}</b> · 종 <b>${won(c)}</b> <span class="${cls(chg)}">${pct(chg,2)}</span></div>
      <div>거래량 <b>${won(ch.v[i])}</b></div>${sig.length?`<div style="color:var(--gold-deep);font-weight:700">👑 ${esc(sig.join(", "))}</div>`:""}`;
    tip.hidden=false;
    const x=gx.X(i), bw=box.clientWidth;
    tip.style.left=Math.min(Math.max(4,x+12), bw-tip.offsetWidth-4)+"px"; tip.style.top="8px";
    if(x+12+tip.offsetWidth>bw) tip.style.left=Math.max(4,x-tip.offsetWidth-12)+"px";
  }
  cv.addEventListener("pointermove",at); cv.addEventListener("pointerdown",at);
  cv.addEventListener("pointerleave",()=>{tip.hidden=true; obj.draw(null);});
}

      <div><span class="eyebrow">${s.market==="KOSPI"?"코스피":"코스닥"} · ${esc(s.code)}</span><h2>${esc(s.name)}</h2>
        <div class="d-meta"><span>${esc(s.sector||"업종 정보 없음")}</span><span>시가총액 ${eok(s.marcap)}</span><span>${esc(stt.date||"")} 종가</span></div></div>
      <div class="d-price">${won(stt.close)}<small class="${cls(stt.chg)}">${pct(stt.chg,2)}</small></div>
    </div>

      ${medal("차트 점수",chartScore(s),c?`${esc(c.regime.name)}`:"시세 없음")}
      ${medal("재무 점수",finScore(s),s.fin?`등급 ${esc(s.fin.grade)}`:"–")}
      ${medal("악재 점수",riskScore(s),s.risk?`위험 ${s.risk.bad} · 주의 ${s.risk.warn}`:"–")}
      ${medal("총점",totalScore(s),Object.entries(w).map(([k,x])=>({chart:"차트",fin:"재무",risk:"악재"}[k]+Math.round(x*100)+"%")).join(" · "),"total")}
    </div>
    ${c?`<div class="two">
      <div class="panel"><h3>일봉 차트 <small style="color:var(--ink-soft);font-weight:500">최근 130거래일 + 앞으로 26일 구름</small></h3>
        <div class="chart-box"><canvas aria-label="${esc(s.name)} 캔들차트"></canvas><div class="tip" hidden></div></div>
        <div class="legend"><span><i style="background:var(--gold)"></i>20일선</span><span><i style="background:var(--red)"></i>60일선</span><span><i style="background:var(--navy)"></i>120일선</span>
          <span><i class="box" style="background:var(--cloud-up);border:1px solid var(--ok)"></i>양운(지지)</span><span><i class="box" style="background:var(--cloud-dn);border:1px solid var(--bad)"></i>음운(저항)</span>
          <span><i style="background:var(--navy);opacity:.6"></i>피보나치</span><span>👑 신호 발생일</span><span>양봉 <b class="up">빨강</b> · 음봉 <b class="down">파랑</b></span></div>
      </div>
      <div class="panel">${regimeCard(s)}</div>
    </div>
    <div class="panel"><h3>차트 시그널 <small style="color:var(--ink-soft);font-weight:500">최근 ${M.lookback||5}거래일 기준 · 합계 ${c.score}점 (100점에서 자름)</small></h3>
      <div class="two" style="gap:4px 18px">${sigRows(s)}</div>
      <div class="calc">계산: ${(c.parts||[]).map(p=>p.key==="regime"?`국면 ${p.points>0?"+":""}${p.points}`:`${esc(SM[p.key]?.name||p.key)} +${p.points}`).join(" · ")||"뜬 신호 없음"} → <b>${c.score}점</b>${c.is_signal?" · 시그널 발생 종목":""}</div>
    </div>`:`<div class="empty">시세를 불러오지 못했어요: ${esc(s.errors?.prices||"")}</div>`}
    <div class="pager" role="tablist" aria-label="상세 페이지">
      <button type="button" role="tab" data-p="1" ${page===1?'aria-current="step"':""}><span>1 / 2</span><b>재무 점수</b></button>
      <button type="button" role="tab" data-p="2" ${page===2?'aria-current="step"':""}><span>2 / 2</span><b>악재 스크리닝</b></button>
    </div>
    <div id="pageBody">${page===1?finPage(s):riskPage(s)}</div>
    <div class="page-foot">
      ${page===2?`<button class="btn" type="button" data-p="1">← 1/2 재무 점수</button>`:"<span></span>"}
      ${page===1?`<button class="btn primary" type="button" data-p="2">다음: 2/2 악재 스크리닝 →</button>`:`<a class="btn primary" href="#search" style="text-decoration:none" data-code="${esc(s.code)}" id="toVerdict">왕의 판결(총점) 보기 →</a>`}
    </div>
    ${errs.length?`<details class="info-note"><summary>데이터 조회 기록 (${errs.length}건 실패)</summary><ul>${errs.map(([k,e])=>`<li>${esc(k)}: ${esc(e)}</li>`).join("")}</ul></details>`:""}`;
  if(c){ const box=$(".chart-box",v); loadChart(s.code, ch=>{ if(!box.isConnected) return; if(ch) mountChart(box,ch); else box.innerHTML=`<div class="empty">차트 파일(c/${esc(s.code)}.js)을 불러오지 못했어요.</div>`; }); }
  $("#backBtn").addEventListener("click",()=>{ location.hash="home"; });
  v.querySelectorAll("[data-p]").forEach(b=>b.addEventListener("click",()=>{ location.hash="stock-"+s.code+(b.dataset.p==="2"?"-2":""); }));
  const tv=$("#toVerdict"); if(tv) tv.addEventListener("click",e=>{ e.preventDefault(); pickSearch(s.code); location.hash="search"; });

/* ── ③ 총점 검색 ── */
let picked=null, sel=-1;
function pickSearch(code){ picked=code; const s=byCode[code]; if(s) $("#sq").value=s.name; renderVerdict(); }
function renderVerdict(){
  const s=byCode[picked], box=$("#verdict");
  if(!s){ box.innerHTML=`<div class="empty">위 검색창에 종목 이름, 코드, 또는 초성을 입력하세요. 예: <b>ㅅㅅㅈㅈ</b></div>`; return; }
  const t=s.total||{}, w=t.weights||{};
  const rows=[["chart","차트",chartScore(s)],["fin","재무",finScore(s)],["risk","악재",riskScore(s)]].map(([k,lab,v])=>{
    const wt=w[k]; const contrib = (v!=null && wt!=null)? v*wt : null;
    return `<div class="bd"><span>${lab} ${wt!=null?Math.round(wt*100)+"%":"<small>(제외)</small>"}</span><div class="meter"><span style="width:${v||0}%"></span></div><span class="num">${sc(v)}점 → ${contrib!=null?contrib.toFixed(1):"–"}</span></div>`;}).join("");
  box.innerHTML=`<div class="verdict">
    <div class="big-coin"><div><b>${sc(t.score)}</b><small>총점 / 100</small></div></div>
    <div style="min-width:0"><span class="eyebrow">왕의 판결 · ${esc(s.code)} · ${s.market==="KOSPI"?"코스피":"코스닥"}</span>
      <h3>${esc(s.name)}</h3><p class="quote">“${verdict(t.score)}”</p>
      <div class="breakdown">${rows}</div>
      ${t.missing&&t.missing.length?`<p class="calc">데이터가 없는 ${t.missing.map(k=>({chart:"차트",fin:"재무",risk:"악재"}[k])).join("·")} 점수는 빼고 나머지 비중을 다시 나눠 계산했어요.</p>`:`<p class="calc">총점 = 차트 × ${Math.round((w.chart||0)*100)}% + 재무 × ${Math.round((w.fin||0)*100)}% + 악재 × ${Math.round((w.risk||0)*100)}%</p>`}
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"><a class="btn primary" style="text-decoration:none" href="#stock-${esc(s.code)}">차트·재무·악재 자세히 →</a></div>
    </div></div>`;
}
function renderTop(){
  const a=S.filter(s=>totalScore(s)!=null).sort((x,y)=>totalScore(y)-totalScore(x)).slice(0,10);
  $("#topList").innerHTML=a.map((s,i)=>`<button type="button" data-code="${esc(s.code)}"><span class="num" style="color:var(--ink-faint)">${i+1}</span><span><b>${esc(s.name)}</b> <small style="color:var(--ink-soft)">${esc(s.code)}</small></span>${regimeBadge(s)}<span class="coin" style="width:42px;height:42px"><b style="font-size:15px">${sc(totalScore(s))}</b></span></button>`).join("");
}
function bindSearch(){
  const inp=$("#sq"), ul=$("#sugg");
  const close=()=>{ul.hidden=true; inp.setAttribute("aria-expanded","false"); sel=-1;};
  function show(){
    const res=search(inp.value);
    if(!res.length){ close(); return; }
    ul.innerHTML=res.map((s,i)=>`<li role="option" id="sg${i}" data-code="${esc(s.code)}" aria-selected="${i===sel}"><span><b>${esc(s.name)}</b> <small>${esc(s.code)}</small></span><small>총점 ${sc(totalScore(s))}</small></li>`).join("");
    ul.hidden=false; inp.setAttribute("aria-expanded","true");
  }
  inp.addEventListener("input",()=>{sel=-1; show();});
  inp.addEventListener("keydown",e=>{
    const items=[...ul.querySelectorAll("li")];
    if(e.key==="ArrowDown"){ e.preventDefault(); sel=Math.min(items.length-1,sel+1); show(); }
    else if(e.key==="ArrowUp"){ e.preventDefault(); sel=Math.max(0,sel-1); show(); }
    else if(e.key==="Enter"){ const it=items[sel>=0?sel:0]; if(it){ pickSearch(it.dataset.code); close(); } }
    else if(e.key==="Escape") close();
  });
  ul.addEventListener("mousedown",e=>{ const li=e.target.closest("li"); if(li){ e.preventDefault(); pickSearch(li.dataset.code); close(); }});
  inp.addEventListener("blur",()=>setTimeout(close,100));
  $("#topList").addEventListener("click",e=>{ const b=e.target.closest("button"); if(b){ pickSearch(b.dataset.code); window.scrollTo({top:$("#v-search").offsetTop-70,behavior:"smooth"}); }});
}

/* ── ④ 왕의 규칙 ── */
function renderRules(){
  const pts=M.chart_points||{}, adj=M.regime_adjust||{}, w=M.weights||{};
  const sample=S.find(s=>s.fin&&s.fin.items&&s.fin.items.some(i=>i.rule));
  const finRows=(sample?sample.fin.items:[]).map(i=>`<tr><td><b>${esc(i.name)}</b><br><small style="color:var(--ink-soft)">${esc(i.explain)}</small></td><td class="n">${i.max}</td><td>${esc(i.rule||"")}</td></tr>`).join("");
  const riskSample=S.find(s=>s.risk)?.risk.items||[];
  const health=Object.values(M.health||{}).map(h=>`<tr><td>${esc(h.label)}</td><td class="n">${h.ok}</td><td class="n" style="color:${h.fail?"var(--bad)":"inherit"}">${h.fail}</td><td><small>${esc(h.sample_error||"")}</small></td></tr>`).join("");
  $("#v-rules").innerHTML=`
    <div class="sec-head"><h2>왕의 규칙</h2><p>점수가 어떻게 매겨지는지 전부 공개합니다. 숫자는 config.py 한 곳에서만 바꿉니다.</p></div>
    <div class="info-note">아래 배점과 기준은 교과서적인 <b>추정치</b>이고 아직 과거 데이터로 검증(백테스트)하지 않았어요. 투자 권유가 아니라 공부용 도구입니다.</div>
    <div class="panel"><h3>① 차트 시그널 (최근 ${M.lookback||5}거래일 안에 뜬 것만 · 100점에서 자름 · ${M.signal_min}점 이상이면 ‘시그널 발생’)</h3>
      <div class="table-wrap"><table><thead><tr><th>묶음</th><th>신호</th><th>배점</th><th>뜻</th></tr></thead><tbody>
      ${Object.entries(SM).map(([k,m])=>`<tr><td>${GROUP_NAME[m.group]}</td><td><b>${esc(m.name)}</b></td><td class="n">+${pts[k]??0}</td><td>${esc(m.desc)}</td></tr>`).join("")}
      </tbody></table></div></div>
    <div class="panel"><h3>② 국면(차트 모양) 판정과 보정 점수</h3>
      <div class="table-wrap"><table><thead><tr><th>국면</th><th>보정</th><th>판정 기준</th></tr></thead><tbody>
        <tr><td>👑 상승추세 눌림목</td><td class="n">${adj.uptrend_pullback>0?"+":""}${adj.uptrend_pullback}</td><td>120일선이 20일간 우상향 + 60일선 &gt; 120일선 + 종가가 120일선의 97% 이상 + (20일 고점 대비 -5% 이상 눌림 또는 20일선 아래)</td></tr>
        <tr><td>🔄 추세전환 시도</td><td class="n">+${adj.reversal}</td><td>20거래일 전엔 하락 구간(구름대 아래 또는 20일선&lt;60일선)이었는데, 지금은 구름대 위이거나 60일선·구름대를 돌파 + 20일선이 고개를 듦</td></tr>
        <tr><td>📈 상승추세</td><td class="n">${adj.uptrend}</td><td>20 &gt; 60 &gt; 120일선 정배열 + 구름대 위 + 120일선 우상향 (눌림 없이 달리는 중)</td></tr>
        <tr><td>⚠️ 하락추세 / 하락 중 반등</td><td class="n">${adj.downtrend}</td><td>20 &lt; 60 &lt; 120일선 역배열, 또는 구름대 아래 + 120일선 하락. 반등 신호가 같이 뜨면 ‘하락 중 반등’</td></tr>
        <tr><td>⏸ 판정 유보</td><td class="n">${adj.pending}</td><td>52주 고점을 찍은 지 60거래일이 안 됐는데 고점 대비 -20% 이상 급락 → 이평선이 아직 못 따라와서 판단을 미룸 (미장 버전에서 겪은 함정)</td></tr>
        <tr><td>➖ 횡보</td><td class="n">${adj.sideways}</td><td>위 어디에도 해당하지 않음</td></tr>
      </tbody></table></div>
      <p class="calc">상승추세인지 단순 반등인지는 ‘지금 모양’으로 구분합니다. 반등이 추세로 이어질지는 미리 알 수 없고, 백테스트로 확률을 재야 하는 영역이에요.</p></div>
    <div class="panel"><h3>③ 재무 점수 (교과서 기준 100점, 사이 값은 부분점수)</h3>
      <div class="table-wrap"><table><thead><tr><th>지표</th><th>배점</th><th>기준</th></tr></thead><tbody>${finRows}</tbody></table></div>
      <p class="calc">데이터가 없는 지표는 0점 처리하지 않고 빼서 100점으로 환산합니다. 금융업은 부채비율·당좌비율·영업이익률을 제외해요.</p></div>
    <div class="panel"><h3>④ 악재 스크리닝 (100점에서 감점)</h3>
      <div class="table-wrap"><table><thead><tr><th>항목</th><th>확인하는 것</th></tr></thead><tbody>
      ${riskSample.map(i=>`<tr><td><b>${esc(i.name)}</b></td><td>${esc(i.explain)}</td></tr>`).join("")}
      </tbody></table></div></div>
    <div class="panel"><h3>⑤ 총점</h3><p style="margin:0">총점 = 차트 × <b>${Math.round((w.chart||0)*100)}%</b> + 재무 × <b>${Math.round((w.fin||0)*100)}%</b> + 악재 × <b>${Math.round((w.risk||0)*100)}%</b> <small style="color:var(--ink-soft)">(임시 비율)</small></p></div>
    <div class="panel"><h3>데이터 상태 (이번 실행)</h3>
      <div class="table-wrap"><table><thead><tr><th>출처</th><th>성공</th><th>실패</th><th>실패 예시</th></tr></thead><tbody>${health}</tbody></table></div>
      ${(M.notes||[]).length?`<ul class="calc">${M.notes.map(n=>`<li>${esc(n)}</li>`).join("")}</ul>`:""}</div>`;
}

/* ── 화면 전환 ── */
const views={home:$("#v-home"),stock:$("#v-stock"),search:$("#v-search"),rules:$("#v-rules")};
function route(){
  const h=(location.hash||"#home").slice(1);
  let name="home", m;
  if((m=h.match(/^stock-([0-9A-Za-z]{6})(?:-(2))?$/))) name="stock";
  else if(h==="search") name="search"; else if(h==="rules") name="rules";
  Object.entries(views).forEach(([k,el])=>el.hidden=(k!==name));
  $("#hero").hidden = name!=="home";
  document.querySelectorAll("[data-nav]").forEach(a=>a.toggleAttribute("aria-current",a.dataset.nav===name || (name==="stock"&&a.dataset.nav==="home")));
  document.querySelectorAll("[data-nav]").forEach(a=>{ if(a.hasAttribute("aria-current")) a.setAttribute("aria-current","page"); });
  if(name==="stock"){ liveCharts.length=0; renderStock(m[1], m[2]?2:1); window.scrollTo(0,0); }
  if(name==="search"){ renderVerdict(); }
  if(name==="rules"){ renderRules(); window.scrollTo(0,0); }
}
window.addEventListener("hashchange",route);

heroStats(); regimePills(); bindList(); renderList(); bindSearch(); renderTop();
$("#foot").innerHTML=`버거대왕의 국장 레이더 · 데이터 출처: 네이버 금융(시세·재무·수급), DART 전자공시 · ${esc(M.generated||"")} 생성 (${M.elapsed_sec??"–"}초)<br>이 페이지는 공부용 자동 분석이며 투자 권유가 아닙니다. 모든 판단과 책임은 투자자 본인에게 있습니다.`;
route();
})();
</script>
