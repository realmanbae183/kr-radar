<style>
/* 레이아웃: 하늘과 성 아래 한 장짜리 장부. 위에서 아래로 — 지금 어떤 장인가 → 후보 → 종목 체크리스트 */
:root{
  --sky-top:#4fb0ee; --sky-bot:#d5f0ff; --cloud:#ffffff; --castle-far:#9cc0de; --castle-near:#6f98c0; --window:#ffe7a3;
  --paper:#fbf6ea; --card:#fffdf7; --line:#e7dcc3; --line-soft:#f0e8d6;
  --ink:#33241a; --ink-soft:#75604b; --ink-faint:#a4927b;
  --gold:#d79a1e; --gold-deep:#996a08; --red:#bf1b30; --navy:#22346a;
  --up:#d42a3a; --down:#1f5fbf; --ok:#23804f; --warn:#b06a00; --bad:#bf1b30;
  --cloud-up:rgba(35,128,79,.13); --cloud-dn:rgba(191,27,48,.11);
  --f-display:"Black Han Sans","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --sky-top:#070d26; --sky-bot:#22336b; --cloud:#3b4c86; --castle-far:#1c2757; --castle-near:#10173a; --window:#ffcf5a;
  --paper:#12172a; --card:#181e34; --line:#2c3556; --line-soft:#222a47;
  --ink:#f1e7d1; --ink-soft:#b9ab8f; --ink-faint:#877d69;
  --gold:#eebb45; --gold-deep:#f3c65c; --red:#ff5d6c; --navy:#a9bcff;
  --up:#ff5d6b; --down:#62a0ff; --ok:#52c98d; --warn:#f0b34a; --bad:#ff5d6b;
  --cloud-up:rgba(82,201,141,.14); --cloud-dn:rgba(255,93,107,.12); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --sky-top:#070d26; --sky-bot:#22336b; --cloud:#3b4c86; --castle-far:#1c2757; --castle-near:#10173a; --window:#ffcf5a;
  --paper:#12172a; --card:#181e34; --line:#2c3556; --line-soft:#222a47;
  --ink:#f1e7d1; --ink-soft:#b9ab8f; --ink-faint:#877d69;
  --gold:#eebb45; --gold-deep:#f3c65c; --red:#ff5d6c; --navy:#a9bcff;
  --up:#ff5d6b; --down:#62a0ff; --ok:#52c98d; --warn:#f0b34a; --bad:#ff5d6b;
  --cloud-up:rgba(82,201,141,.14); --cloud-dn:rgba(255,93,107,.12); color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.65 var(--f-body);font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
a{color:var(--navy)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:4px}
.wrap{max-width:1060px;margin:0 auto;padding-inline:18px}
.num{font-family:var(--f-num)}
.up{color:var(--up)} .down{color:var(--down)} .soft{color:var(--ink-soft)} .faint{color:var(--ink-faint)}
h1,h2,h3{text-wrap:balance;font-weight:600}

/* 상단 */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--paper) 94%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--gold)}
.bar .wrap{display:flex;align-items:center;gap:6px 16px;min-height:52px;flex-wrap:wrap;padding-block:6px}
.brand{font-family:var(--f-display);font-size:18px;text-decoration:none;color:var(--ink);margin-right:auto}
.nav{display:flex;gap:14px}
.nav a{text-decoration:none;color:var(--ink-soft);font-size:14px;padding:4px 0;border-bottom:2px solid transparent}
.nav a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--gold)}
.meta-links{display:flex;gap:12px;font-size:12.5px;color:var(--ink-soft);flex-wrap:wrap;align-items:center}
.meta-links a{color:var(--ink-soft)}
.meta-links .live{color:var(--warn)}
.linkbtn{background:none;border:0;padding:0;cursor:pointer;color:var(--ink-soft);font-size:12.5px;text-decoration:underline}
@media (max-width:700px){.bar{position:static}}

/* 히어로 */
.hero{position:relative;overflow:hidden;background:linear-gradient(180deg,var(--sky-top),var(--sky-bot));padding-block:26px 0}
.cloud{position:absolute;background:var(--cloud);border-radius:999px;opacity:.85}
.cloud::before,.cloud::after{content:"";position:absolute;background:inherit;border-radius:50%}
.cloud.c1{width:150px;height:38px;top:30px;left:5%}.cloud.c1::before{width:70px;height:60px;left:22px;top:-30px}.cloud.c1::after{width:56px;height:46px;left:74px;top:-18px}
.cloud.c2{width:180px;height:44px;top:18px;right:-30px}.cloud.c2::before{width:84px;height:72px;left:26px;top:-36px}.cloud.c2::after{width:66px;height:54px;left:96px;top:-22px}
.hero-grid{position:relative;z-index:2;display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:26px;align-items:end}
.hero-copy{padding-bottom:58px;min-width:0}
.title{margin:0;font-family:var(--f-display);font-weight:400;font-size:clamp(34px,6vw,60px);line-height:1.05;color:var(--red);-webkit-text-stroke:2px #fff;paint-order:stroke fill;text-shadow:0 3px 0 #7a1020}
.title span{display:block;font-size:.5em;color:#fff;-webkit-text-stroke:0;text-shadow:0 2px 0 rgba(29,45,92,.55)}
.lede{max-width:36em;margin:12px 0 0;color:#10254d}
:root[data-theme="dark"] .lede{color:#dbe4ff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .lede{color:#dbe4ff}}
.portrait{margin:0 0 50px}
.frame{display:block;width:100%;padding:8px;border:0;cursor:zoom-in;border-radius:16px;background:linear-gradient(145deg,#ffd66b,#e3a82b 40%,#a8700d 70%,#ffd66b);box-shadow:0 14px 30px -14px rgba(0,0,0,.55)}
.frame img{display:block;width:100%;height:auto;aspect-ratio:1/1;object-fit:contain;border-radius:10px;background:#f7efe0}
.castle{position:absolute;left:0;right:0;bottom:-1px;height:96px;z-index:1;width:100%}
.castle .far{fill:var(--castle-far)} .castle .near{fill:var(--castle-near)} .castle .win{fill:var(--window)} .castle .ground{fill:var(--paper)}
@media (max-width:700px){.hero-grid{grid-template-columns:1fr}.hero-copy{padding-bottom:6px}.portrait{max-width:230px;margin-bottom:70px}}

main{padding-block:26px 60px}
.view{display:grid;gap:26px}
section > h2{margin:0 0 8px;font-size:19px}
.note{font-size:13.5px;color:var(--ink-soft)}
.banner{border-left:3px solid var(--warn);padding:4px 0 4px 12px;font-size:14px;color:var(--ink-soft)}
.banner.demo{border-left-color:var(--red)}
hr{border:0;border-top:1px solid var(--line);margin:0}

/* 시장 */
.mkt-line{font-size:17px;margin:0}
.mkt-line b{font-family:var(--f-num);font-weight:500;font-size:26px}
.bbar{position:relative;height:8px;background:var(--line-soft);border-radius:4px;margin:14px 0 20px;max-width:560px}
.bbar span{position:absolute;inset:0 auto 0 0;border-radius:4px;background:var(--gold)}
.bbar i{position:absolute;top:-4px;bottom:-4px;width:1px;background:var(--ink-faint)}
.bbar em{position:absolute;top:13px;font-style:normal;font-size:11px;color:var(--ink-faint);transform:translateX(-50%)}
.spark{display:block;width:100%;max-width:560px;height:54px}
.facts{display:grid;gap:3px;margin:12px 0 0;padding:0;list-style:none;font-size:14.5px}

/* 후보 목록 */
.tabs{display:flex;gap:18px;border-bottom:1px solid var(--line)}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:6px 0;cursor:pointer;font-size:16px;color:var(--ink-soft)}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--gold);font-weight:600}
.filters{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;font-size:13.5px;color:var(--ink-soft)}
.filters input[type=search]{flex:1 1 200px;min-width:0;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 11px;font-size:14px}
.filters select{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 8px;font-size:13.5px}
.filters label{display:inline-flex;gap:5px;align-items:center;cursor:pointer}
.filters input[type=checkbox]{accent-color:var(--gold);width:15px;height:15px}
.rows{display:grid}
.row{display:grid;grid-template-columns:30px minmax(0,1.25fr) minmax(0,1.6fr) minmax(0,1.5fr) 92px;gap:4px 14px;align-items:baseline;text-align:left;background:none;border:0;border-bottom:1px solid var(--line-soft);padding:11px 4px;cursor:pointer;width:100%}
.row:hover{background:color-mix(in srgb,var(--gold) 7%,transparent)}
.grade{font-family:var(--f-display);font-size:19px;line-height:1;color:var(--gold-deep)}
.grade.gD,.grade.gN{color:var(--ink-faint)}
.row .nm{font-weight:600;overflow-wrap:anywhere}
.row .nm small{display:block;font-weight:400;font-size:12px;color:var(--ink-faint)}
.row .c{font-size:13.5px;min-width:0}
.row .c small{display:block;font-size:12px;color:var(--ink-faint)}
.row .px{text-align:right;font-family:var(--f-num);font-size:13.5px}
.row .px small{display:block;font-size:12px}
.warnmark{color:var(--bad);font-size:12px}
@media (max-width:760px){.row{grid-template-columns:26px minmax(0,1fr) 84px}.row .c{grid-column:2/-1}}
.more{justify-self:start;background:none;border:1px solid var(--line);border-radius:8px;padding:7px 14px;cursor:pointer;margin-top:10px}
.empty{padding:18px 0;color:var(--ink-soft)}

/* 상세 */
.back{background:none;border:0;padding:0;color:var(--ink-soft);cursor:pointer;justify-self:start}
.d-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-end;flex-wrap:wrap;border-bottom:1px solid var(--gold);padding-bottom:12px}
.d-head h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:clamp(28px,5vw,40px);line-height:1.1}
.d-price{font-family:var(--f-num);font-size:24px;text-align:right;line-height:1.2}
.d-price small{display:block;font-size:13.5px}
.chart-box{position:relative}
.chart-box canvas{display:block;width:100%;height:340px;touch-action:pan-y}
@media (max-width:640px){.chart-box canvas{height:270px}}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--ink-faint);margin-top:6px}
.legend i{display:inline-block;width:14px;height:2px;vertical-align:middle;margin-right:5px}
.tip{position:absolute;pointer-events:none;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:5px 8px;font-size:12px;line-height:1.45;z-index:3;min-width:140px}
.check{display:grid;gap:0;margin:0;padding:0;list-style:none}
.check li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;padding:8px 0;border-bottom:1px solid var(--line-soft)}
.check li:last-child{border-bottom:0}
.check .mk{font-family:var(--f-num);color:var(--ink-faint)}
.check li.on .mk{color:var(--gold-deep)}
.check li.bad .mk{color:var(--bad)}
.check li.good .mk{color:var(--ok)}
.check small{display:block;color:var(--ink-soft);font-size:13px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 18px;margin:0;font-size:14.5px}
.kv dt{color:var(--ink-soft)} .kv dd{margin:0}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:6px 10px 6px 0;border-bottom:1px solid var(--line-soft);text-align:left;vertical-align:top}
th{font-weight:500;color:var(--ink-soft);font-size:12.5px;white-space:nowrap}
td.n,th.n{text-align:right;font-family:var(--f-num);white-space:nowrap}
.tw{overflow-x:auto}
.pager{display:flex;gap:18px;border-bottom:1px solid var(--line)}
.pager button{background:none;border:0;border-bottom:2px solid transparent;padding:6px 0;cursor:pointer;color:var(--ink-soft);font-size:15px}
.pager button[aria-current="step"]{color:var(--ink);border-bottom-color:var(--gold);font-weight:600}
.meter{position:relative;height:5px;border-radius:3px;background:var(--line-soft)}
.meter span{position:absolute;inset:0 auto 0 0;border-radius:3px;background:var(--gold)}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 14px;padding:10px 0;border-bottom:1px solid var(--line-soft)}
.item small{display:block;color:var(--ink-soft);font-size:12.5px}
.item .val{text-align:right;font-family:var(--f-num);font-size:14px}
.item .full{grid-column:1/-1}
.st-ok{color:var(--ok)} .st-warn{color:var(--warn)} .st-bad{color:var(--bad)} .st-unknown,.st-na{color:var(--ink-faint)}
.btn{background:none;border:1px solid var(--gold);border-radius:8px;padding:8px 14px;cursor:pointer;text-decoration:none;color:var(--ink);display:inline-block}
.search-big{width:100%;max-width:560px;font-size:18px;padding:11px 14px;border-radius:10px;border:1px solid var(--gold);background:var(--card)}
.foot{border-top:1px solid var(--line);padding-block:16px 34px;color:var(--ink-faint);font-size:12.5px}
dialog{border:0;padding:0;background:transparent;max-width:min(96vw,900px)}
dialog::backdrop{background:rgba(8,12,30,.8)}
dialog img{display:block;height:auto;max-height:90vh;border-radius:10px}
dialog button{border:0;background:var(--gold);color:#33241a;border-radius:6px;padding:5px 12px;cursor:pointer;margin-bottom:6px}
</style>

<script>
(function(){
"use strict";
const R = window.RADAR || {meta:{}, stocks:[]};
const M = R.meta, S = R.stocks, T = M.table || {}, RU = M.rules || {};
const byCode = Object.fromEntries(S.map(s=>[s.code,s]));
const $ = (s,el=document)=>el.querySelector(s);
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const FT = M.fin_text || {}, RT = M.risk_text || {};
S.forEach(s=>{ (s.fin?.items||[]).forEach(i=>{ i.explain=FT[i.key]?.explain||""; if(i.status==="ok") i.rule=FT[i.key]?.rule||""; });
               (s.risk?.items||[]).forEach(i=>{ i.explain=RT[i.key]||""; }); });

const won = v => v==null? "–" : Math.round(v).toLocaleString("ko-KR");
const cnt = v => v==null? "–" : Number(v).toLocaleString("ko-KR");
const pct = (v,d=1) => v==null? "–" : (v>0?"+":"")+Number(v).toFixed(d)+"%";
const eok = v => { if(v==null) return "–"; if(v>=10000) return (v/10000).toFixed(v>=100000?0:1)+"조"; return Math.round(v).toLocaleString("ko-KR")+"억"; };
const cls = v => v==null? "" : v>0? "up" : v<0? "down" : "";
const mktName = m => m==="KOSPI"?"코스피":"코스닥";

/* 초성 검색 */
const CHO = "ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ";
const chosung = s => [...s].map(ch=>{const c=ch.charCodeAt(0)-0xAC00; return (c>=0&&c<11172)? CHO[Math.floor(c/588)] : ch;}).join("");
S.forEach(s=>{ s._cho = chosung(s.name); s._lc = s.name.toLowerCase(); });
function matches(s,q){ q=(q||"").trim().toLowerCase(); if(!q) return true; if(/^[ㄱ-ㅎ]+$/.test(q)) return s._cho.includes(q); return s._lc.includes(q) || s.code.toLowerCase().startsWith(q); }

/* 차트 파일 */
const chartCache=window.__CHARTS||{}, chartWait={};
window.__chart=(code,data)=>{ chartCache[code]=data; (chartWait[code]||[]).forEach(f=>f(data)); delete chartWait[code]; };
function loadChart(code,cb){
  if(chartCache[code]) return cb(chartCache[code]);
  if(chartWait[code]){ chartWait[code].push(cb); return; }
  chartWait[code]=[cb];
  const sc=document.createElement("script"); sc.src="c/"+code+".js";
  sc.onerror=()=>{ (chartWait[code]||[]).forEach(f=>f(null)); delete chartWait[code]; };
  document.head.appendChild(sc);
}

function cssv(n){ return getComputedStyle(root).getPropertyValue(n).trim(); }
function drawSpark(){
  const cv=$("#spark"), m=M.market||{}; if(!cv||!m.breadth_hist) return;
  const dpr=window.devicePixelRatio||1, W=cv.clientWidth, H=cv.clientHeight; if(!W) return;
  cv.width=W*dpr; cv.height=H*dpr; const g=cv.getContext("2d"); g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,W,H);
  const a=m.breadth_hist, n=a.length, X=i=>4+i*(W-44)/(n-1), Y=v=>4+(100-v)/100*(H-18);
  g.strokeStyle=cssv("--line"); g.lineWidth=1; g.setLineDash([3,3]);
  [30,50].forEach(v=>{ g.beginPath(); g.moveTo(4,Y(v)); g.lineTo(W-40,Y(v)); g.stroke(); });
  g.setLineDash([]); g.fillStyle=cssv("--ink-faint"); g.font="10px "+cssv("--f-num"); g.textBaseline="middle";
  g.fillText("30%",W-36,Y(30)); g.fillText("50%",W-36,Y(50));
  g.strokeStyle=cssv("--gold"); g.lineWidth=1.6; g.beginPath(); let on=false;
  a.forEach((v,i)=>{ if(v==null){on=false;return;} on? g.lineTo(X(i),Y(v)) : g.moveTo(X(i),Y(v)); on=true; }); g.stroke();
  const li=n-1; if(a[li]!=null){ g.fillStyle=cssv("--gold-deep"); g.beginPath(); g.arc(X(li),Y(a[li]),3,0,7); g.fill(); }
  g.fillStyle=cssv("--ink-faint"); g.textBaseline="alphabetic"; g.textAlign="left"; g.fillText((m.breadth_dates||[])[0]||"",4,H-1); g.textAlign="right"; g.fillText("오늘",X(li)+8,H-1);
}

/* ── 후보 목록 ── */
const st={tab:"os", q:"", mkt:"all", sort:"grade", weak:false, hideBad:false, shown:40};
try{ const o=JSON.parse(localStorage.getItem("bk-list")||"{}"); ["mkt","sort","weak","hideBad"].forEach(k=>{ if(k in o) st[k]=o[k]; }); }catch(e){}
const saveSt=()=>{ try{localStorage.setItem("bk-list",JSON.stringify({mkt:st.mkt,sort:st.sort,weak:st.weak,hideBad:st.hideBad}))}catch(e){} };
const GR={A:0,B:1,C:2,D:3};
function pick(s){ const g=s.sig; if(!g) return null; if(st.tab==="os"){ const e=g.os.event; return e? {ev:e, hist:g.os.hist, grade:g.os.grade, level:g.os.hist_level}:null; } return g.bo? {ev:g.bo, hist:g.bo.hist, grade:g.bo.grade, level:g.bo.hist_level}:null; }
function candidates(){
  let a=S.map(s=>({s,p:pick(s)})).filter(x=>x.p && (st.mkt==="all"||x.s.market===st.mkt) && matches(x.s,st.q));
  if(st.tab==="os" && !st.weak) a=a.filter(x=>x.p.ev.n>=(RU.min_count||2));
  if(st.hideBad) a=a.filter(x=>!(x.s.risk&&x.s.risk.bad));
  const key={
    grade:x=>[GR[x.p.grade]??4, -(x.p.hist?.w5??0), x.p.ev.ago],
    win:x=>[-(x.p.hist?.w5??0), x.p.ev.ago],
    recent:x=>[x.p.ev.ago, GR[x.p.grade]??4],
    deep:x=>[x.s.sig.stats.gap??0],
    marcap:x=>[-(x.s.marcap||0)],
  }[st.sort];
  a.sort((x,y)=>{ const kx=key(x), ky=key(y); for(let i=0;i<kx.length;i++){ if(kx[i]!==ky[i]) return kx[i]-ky[i]; } return 0; });
  return a;
}
function rowHtml(x){
  const s=x.s, p=x.p, e=p.ev, stt=s.sig.stats, bad=s.risk&&s.risk.bad;
  let c1, c2;
  if(st.tab==="os"){
    c1=`${e.n}개 겹침 — ${esc(sigNames(e.flags,e))}<small>${when(e.ago)}${e.ago>0?` · 그 뒤 <span class="${cls(e.ret_since)}">${pct(e.ret_since)}</span>`:""}${e.depth?" · "+esc(e.depth):""}</small>`;
    c2=`${esc(histShort(p.hist))}<small>120일선 ${e.trend_up?"상승 중":"하락 중"} · 그날 시장 폭 ${e.breadth??"–"}%</small>`;
  } else {
    c1=`구름대 상단 돌파 · 거래량 ${e.vol_mult}배<small>${when(e.ago)}${e.ago>0?` · 그 뒤 <span class="${cls(e.ret_since)}">${pct(e.ret_since)}</span>`:""}</small>`;
    c2=`${esc(histShort(p.hist))}<small>120일선 ${e.trend_up?"상승 중":"하락 중"} · 코스피 ${e.both_up?"20·120일선 모두 위":"20일선 또는 120일선 아래"}</small>`;
  }
  return `<button class="row" type="button" data-code="${esc(s.code)}">
    ${gradeHtml(p.grade)}
    <span class="nm">${esc(s.name)}${bad?` <span class="warnmark">악재 ${s.risk.bad}</span>`:""}<small>${esc(s.code)} · ${mktName(s.market)}${s.sector?" · "+esc(s.sector):""}</small></span>
    <span class="c">${c1}</span><span class="c">${c2}</span>
    <span class="px">${won(stt.close)}<small class="${cls(stt.chg)}">${pct(stt.chg,2)}</small></span></button>`;
}

/* ── 캔들차트 ── */
const live=[];
function niceStep(x){ const p=Math.pow(10,Math.floor(Math.log10(x))); const f=x/p; return (f<1.5?1:f<3?2:f<7?5:10)*p; }
function drawChart(cv,ch,hover){
  const dpr=window.devicePixelRatio||1, W=cv.clientWidth, H=cv.clientHeight; if(!W||!H) return {};
  cv.width=W*dpr; cv.height=H*dpr; const g=cv.getContext("2d"); g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,W,H);
  const n=ch.c.length, total=ch.sa.length, padL=4, padR=60, padT=8, volH=Math.round(H*.15), dateH=16, pb=H-volH-dateH-6;
  const xw=(W-padL-padR)/total, X=i=>padL+(i+.5)*xw;
  let lo=Infinity, hi=-Infinity; for(let i=0;i<n;i++){ lo=Math.min(lo,ch.l[i]); hi=Math.max(hi,ch.h[i]); }
  const span=hi-lo, inR=v=>v!=null&&v>lo-span*.3&&v<hi+span*.3;
  [ch.ma20,ch.ma60,ch.ma120,ch.bbl,ch.sa,ch.sb].forEach(a=>a.forEach(v=>{ if(inR(v)){lo=Math.min(lo,v);hi=Math.max(hi,v);} }));
  lo-=span*.06; hi+=span*.06; const Y=v=>padT+(hi-v)/(hi-lo)*(pb-padT);
  const ink=cssv("--ink-faint"), grid=cssv("--line-soft"), up=cssv("--up"), dn=cssv("--down");
  g.font="11px "+cssv("--f-num"); g.textBaseline="middle"; g.textAlign="left";
  const step=niceStep((hi-lo)/5); g.strokeStyle=grid; g.lineWidth=1; g.fillStyle=ink;
  for(let v=Math.ceil(lo/step)*step; v<hi; v+=step){ const y=Math.round(Y(v))+.5; g.beginPath(); g.moveTo(padL,y); g.lineTo(W-padR,y); g.stroke(); g.fillText(won(v),W-padR+5,y); }
  for(let i=1;i<total;i++){ const a0=ch.sa[i-1],b0=ch.sb[i-1],a1=ch.sa[i],b1=ch.sb[i]; if([a0,b0,a1,b1].some(v=>v==null)) continue;
    g.fillStyle=(a1>=b1)?cssv("--cloud-up"):cssv("--cloud-dn"); g.beginPath(); g.moveTo(X(i-1),Y(a0)); g.lineTo(X(i),Y(a1)); g.lineTo(X(i),Y(b1)); g.lineTo(X(i-1),Y(b0)); g.closePath(); g.fill(); }
  const line=(arr,color,w,dash)=>{ g.strokeStyle=color; g.lineWidth=w; g.setLineDash(dash||[]); g.beginPath(); let on=false; for(let i=0;i<n;i++){ const v=arr[i]; if(v==null){on=false;continue;} on? g.lineTo(X(i),Y(v)) : g.moveTo(X(i),Y(v)); on=true; } g.stroke(); g.setLineDash([]); };
  line(ch.ma120,cssv("--navy"),1.4); line(ch.ma60,cssv("--ink-faint"),1.1); line(ch.ma20,cssv("--gold"),1.6); line(ch.bbl,cssv("--gold"),1,[4,3]);
  const bw=Math.max(1,Math.min(8,xw*.66));
  for(let i=0;i<n;i++){ const o=ch.o[i],c=ch.c[i],col=c>=o?up:dn,x=X(i); g.strokeStyle=col; g.fillStyle=col; g.lineWidth=1;
    g.beginPath(); g.moveTo(Math.round(x)+.5,Y(ch.h[i])); g.lineTo(Math.round(x)+.5,Y(ch.l[i])); g.stroke();
    const y1=Y(Math.max(o,c)), y2=Y(Math.min(o,c)); g.fillRect(x-bw/2,y1,bw,Math.max(1,y2-y1)); }
  const vmax=Math.max(...ch.v,1), vt=pb+6; g.globalAlpha=.4;
  for(let i=0;i<n;i++){ const h=ch.v[i]/vmax*(volH-2); g.fillStyle=ch.c[i]>=ch.o[i]?up:dn; g.fillRect(X(i)-bw/2,vt+volH-h,bw,h); } g.globalAlpha=1;
  const byI={}; (ch.marks||[]).forEach(m=>{ (byI[m.i]=byI[m.i]||[]).push(m); });
  Object.keys(byI).forEach(i=>{ i=+i; const ms=byI[i], os=ms.find(m=>m.k==="os"), bo=ms.find(m=>m.k==="bo");

    if(bo){ const y=Math.max(Y(ch.h[i])-9,padT+4); g.fillStyle=cssv("--red"); g.beginPath(); g.moveTo(X(i),y-4); g.lineTo(X(i)+4,y+3); g.lineTo(X(i)-4,y+3); g.closePath(); g.fill(); } });
  g.fillStyle=ink; g.textAlign="center"; const ev=Math.max(1,Math.round(n/6));

function mountChart(box,ch){

function histTable(h, bl, blName){

  return `<div class="tw"><table><thead><tr><th></th><th class="n">횟수</th><th class="n">5일 승률</th><th class="n">평균</th><th class="n">10일 승률</th><th class="n">평균</th><th class="n">20일 승률</th><th class="n">평균</th></tr></thead>
    <tbody>${row("이 상태",h)}${bl?row(blName||"아무 날 아무 종목",bl):""}</tbody></table></div>
    <p class="note" style="margin:8px 0 0">서로 다른 날짜로는 ${cnt(h.dates)}일. 사고 나서 10일 안에 평균 ${h.mae10??"–"}%까지 물렸고, 나쁜 5%의 경우 10일 뒤 ${h.p5_10??"–"}%였어요. 종가에 사서 종가에 팔고 왕복 비용 ${RU.cost}%를 뺀 숫자예요.</p>`;
}

      시장 폭이 30% 미만인 날을 기회로 봅니다. 시장이 멀쩡한데 혼자 빠진 종목은 넘깁니다.<br>
      종목의 120일선이 오르는 중이면 더 믿습니다.<br>
      5일에서 20일 들고 갑니다. 그 이상은 신호와 무관했습니다.<br>
      돌파는 시장도 종목도 상승 추세이고 거래량이 실렸을 때만 따로 봅니다.</p>
      <p class="note">매크로(금리·유가·환율)는 규칙에 넣지 않았어요. 직접 판단해서 얹는 영역입니다. 투자 권유가 아니라 공부용 도구예요.</p></section>
    <section><h2>근거</h2>
      <p class="note" style="margin:0 0 10px">${esc(tm.from||"")} ~ ${esc(tm.to||"")} · ${tm.stocks??"–"}종목 · 신호일 종가에 사서 N거래일 뒤 종가에 팔고 왕복 비용 ${tm.cost??RU.cost}%를 뺀 결과. ${esc(tm.built||"")} 계산. 정식 실행 때마다 다시 계산돼요.</p>
      <h3 style="font-size:15px;margin:14px 0 4px">겹칠수록</h3>
      ${tbl(statRow("기준선: 아무 날 아무 종목",ba,null)+statRow("과매도 1개",o["1|*|*"],ba)+statRow("과매도 2개 겹침",o["2|*|*"],ba)+statRow("과매도 3개 겹침",o["3|*|*"],ba))}
      <h3 style="font-size:15px;margin:18px 0 4px">시장이 다 같이 빠진 날일수록 (과매도 2개 겹침)</h3>
      ${tbl(statRow("시장 폭 30% 미만",o["2|*|lt30"],b.lt30)+statRow("시장 폭 30~50%",o["2|*|30_50"],b["30_50"])+statRow("시장 폭 50% 이상",o["2|*|ge50"],b.ge50))}
      <p class="note">'기준 대비'는 같은 시장 폭이던 날 아무 종목을 샀을 때와의 차이예요. 5년 중 시장 폭 30% 미만은 ${cnt(tm.breadth_days?.lt30)}일, 30~50%는 ${cnt(tm.breadth_days?.["30_50"])}일, 50% 이상은 ${cnt(tm.breadth_days?.ge50)}일이었어요.</p>
      <h3 style="font-size:15px;margin:18px 0 4px">종목 추세까지 (과매도 2개 겹침 · 시장 폭 30% 미만)</h3>
      ${tbl(statRow("120일선 상승 중",o["2|U|lt30"],b.lt30)+statRow("120일선 하락 중",o["2|D|lt30"],b.lt30)+statRow("3개 겹침 · 120일선 상승 중",o["3|U|lt30"],b.lt30))}
      <h3 style="font-size:15px;margin:18px 0 4px">깊이 빠질수록 (조건 하나씩)</h3>
      ${tbl(statRow("RSI 30 아래 진입",sg.rsi,ba)+statRow("RSI 25 아래 진입",sg.rsi25,ba)+statRow("RSI 20 아래 진입",sg.rsi20,ba)+statRow("볼린저 하단 이탈",sg.bb,ba)+statRow("20일선 대비 -10%",sg.gap,ba)+statRow("20일선 대비 -15%",sg.gap15,ba)+statRow("20일선 대비 -20%",sg.gap20,ba))}
      <h3 style="font-size:15px;margin:18px 0 4px">거래량 실린 구름대 상단 돌파</h3>
      ${tbl(statRow("종목 상승 · 코스피 20·120일선 모두 위",bo["U|both_up"],ba)+statRow("종목 상승 · 그 외",bo["U|other"],ba)+statRow("종목 하락 · 코스피 모두 위",bo["D|both_up"],ba)+statRow("종목 하락 · 그 외",bo["D|other"],ba))}
      <h3 style="font-size:15px;margin:18px 0 4px">구름대 진입 뒤 20일 (조건이 몇 개 붙었나)</h3>
      <div class="tw"><table><thead><tr><th>붙은 조건</th><th class="n">횟수</th><th class="n">상단 먼저</th><th class="n">하단 아래로 먼저</th></tr></thead><tbody>
      ${["0-1","2","3","4","5","6"].map(k=>cl[k]?`<tr><td>${k==="0-1"?"0~1개":k+"개"}</td><td class="n">${cnt(cl[k].n)}</td><td class="n">${cl[k].top}%</td><td class="n">${cl[k].bottom}%</td></tr>`:"").join("")}</tbody></table></div>
      <h3 style="font-size:15px;margin:18px 0 4px">60일 들고 있었다면 (과매도 2개 이상에서 매수)</h3>
      <div class="tw"><table><thead><tr><th></th><th class="n">횟수</th><th class="n">-20% 넘게 물린 적 있음</th><th class="n">평균 최대 낙폭</th><th class="n">나쁜 5%</th></tr></thead><tbody>
      ${["KOSPI","KOSDAQ"].map(k=>hd[k]?`<tr><td>${mktName(k)}</td><td class="n">${cnt(hd[k].n)}</td><td class="n">${hd[k].down20}%</td><td class="n">${hd[k].mean}%</td><td class="n">${hd[k].p5}%</td></tr>`:"").join("")}</tbody></table></div>
    </section>
    <section><h2>이 숫자의 약점</h2><p style="margin:0">지금 시가총액 상위 종목만 봤어요. 5년 사이 무너져서 빠진 종목은 들어 있지 않아서 실제보다 좋게 나옵니다.<br>
      시장이 급락한 날엔 수백 종목이 한꺼번에 신호를 내요. 횟수가 수천이어도 실제로는 급락 사건 수십 번의 결과라서 '날짜 수'를 같이 적었어요.<br>
      그 급락들 뒤에 시장이 회복했기 때문에 좋게 나온 면이 있어요. 회복하지 못하는 하락장에서는 다를 수 있습니다.<br>
      효과가 없어서 뺀 신호: MACD·RSI·스토캐스틱 골든크로스, 20일·60일선 돌파, 20·60 골든크로스, 외국인·기관 순매수.</p></section>
    <section><h2>재무 점수와 악재 스크리닝</h2>
      <div class="tw"><table><thead><tr><th>재무 지표</th><th class="n">배점</th><th>기준</th></tr></thead><tbody>${(sample?sample.fin.items:[]).map(i=>`<tr><td>${esc(i.name)}</td><td class="n">${i.max}</td><td class="soft">${esc(i.rule||"")}</td></tr>`).join("")}</tbody></table></div>
      <p class="note">악재 스크리닝은 100점에서 감점해요. ${(S.find(s=>s.risk)?.risk.items||[]).map(i=>esc(i.name)).join(", ")}. 차트 신호와는 따로, 사면 안 되는 종목을 거르는 용도예요.</p></section>
    <section><h2>데이터 상태</h2>
      <div class="tw"><table><thead><tr><th>출처</th><th class="n">성공</th><th class="n">저장분 대체</th><th class="n">실패</th><th>메모</th></tr></thead><tbody>${health}</tbody></table></div>
      ${(M.notes||[]).length?`<p class="note">${M.notes.map(esc).join("<br>")}</p>`:""}
      <p class="note">평일 장중 30분마다 시세만 새로 받아 갱신하고, 15:45와 18:10에 전부 새로 받아요. 급할 땐 위쪽 '지금 갱신'을 눌러 GitHub에서 Run workflow를 누르면 2~3분 뒤 반영돼요.</p></section>`;
}

/* ── 화면 전환 ── */
const views={home:$("#v-home"),stock:$("#v-stock"),search:$("#v-search"),rules:$("#v-rules")};
function route(){
  const h=(location.hash||"#home").slice(1); let name="home", m;
  if((m=h.match(/^stock-([0-9A-Za-z]{6})(?:-(2))?$/))) name="stock"; else if(h==="search") name="search"; else if(h==="rules") name="rules";
  Object.entries(views).forEach(([k,el])=>el.hidden=(k!==name));
  $("#hero").hidden = name!=="home";
  document.querySelectorAll("[data-nav]").forEach(a=>{ const on=a.dataset.nav===name||(name==="stock"&&a.dataset.nav==="home"); if(on) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current"); });
  if(name==="stock"){ live.length=0; const keep=route._code===m[1]; renderStock(m[1], m[2]?2:1); if(!keep) window.scrollTo(0,0); route._code=m[1]; } else route._code=null;
  if(name==="rules"){ renderRules(); window.scrollTo(0,0); }
  if(name==="search"){ renderSearch(); }
  if(name==="home"){ drawSpark(); }
}
window.addEventListener("hashchange",route);
$("#sq").addEventListener("input",renderSearch);
$("#sRows").addEventListener("click",e=>{const b=e.target.closest(".row"); if(b) location.hash="stock-"+b.dataset.code;});

header(); marketSection(); bindList(); renderList();
$("#foot").innerHTML=`버거대왕의 국장 레이더 · ${esc(M.generated||"")} 생성 · 데이터: 네이버 금융, 와이즈리포트, DART · 공부용 자동 분석이며 투자 권유가 아닙니다.`;
route();
})();
</script>
