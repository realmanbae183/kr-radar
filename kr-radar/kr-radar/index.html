<title>버거대왕의 국장 레이더</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Jua&family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* 레이아웃 개념: 하늘과 성(히어로) 아래 펼쳐진 양피지 칙서. 왕관·리본·금화 = 점수와 등급 */
:root{
  --sky-top:#2f9ff5; --sky-bot:#c8ecff; --cloud:#ffffff; --castle-far:#8fc0ea; --castle-near:#5b93d1; --window:#ffe27a;
  --paper:#fffcf5; --paper-2:#fff1cf; --card:#ffffff; --line:#f1dca6;
  --ink:#2a1a0d; --ink-soft:#6a4b2c; --ink-faint:#a08560;
  --gold:#f7b51c; --gold-hi:#ffdd6e; --gold-deep:#b97a00;
  --red:#e3193c; --red-soft:#ffe0e5; --navy:#2348c4; --navy-soft:#e2eaff;
  --up:#e3193c; --down:#1c63d8;
  --ok:#0e9f5b; --ok-soft:#d9f6e6; --warn:#c77700; --warn-soft:#fff0cf; --bad:#e3193c; --bad-soft:#ffe0e5; --unk:#7d7466; --unk-soft:#efeae0;
  --cloud-up:rgba(35,128,79,.16); --cloud-dn:rgba(195,23,46,.14);
  --shadow:0 1px 0 rgba(58,36,19,.06),0 6px 18px -8px rgba(58,36,19,.25);
  --f-display:"Black Han Sans","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --sky-top:#070d26; --sky-bot:#22336b; --cloud:#3b4c86; --castle-far:#1c2757; --castle-near:#10173a; --window:#ffcf5a;
  --paper:#12172a; --paper-2:#1a2139; --card:#1a2038; --line:#2d3657;
  --ink:#f3e8d0; --ink-soft:#c2b393; --ink-faint:#8b8069;
  --gold:#f0bd48; --gold-hi:#ffe08a; --gold-deep:#f5c75a;
  --red:#ff5a6a; --red-soft:#3d1c26; --navy:#a9bcff; --navy-soft:#232d52;
  --up:#ff5d6b; --down:#62a0ff;
  --ok:#52c98d; --ok-soft:#173327; --warn:#f2b54a; --warn-soft:#3a2c14; --bad:#ff5d6b; --bad-soft:#3d1c26; --unk:#9a96a8; --unk-soft:#262a3c;
  --cloud-up:rgba(82,201,141,.16); --cloud-dn:rgba(255,93,107,.14);
  --shadow:0 1px 0 rgba(0,0,0,.3),0 8px 22px -10px rgba(0,0,0,.7);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --sky-top:#070d26; --sky-bot:#22336b; --cloud:#3b4c86; --castle-far:#1c2757; --castle-near:#10173a; --window:#ffcf5a;
  --paper:#12172a; --paper-2:#1a2139; --card:#1a2038; --line:#2d3657;
  --ink:#f3e8d0; --ink-soft:#c2b393; --ink-faint:#8b8069;
  --gold:#f0bd48; --gold-hi:#ffe08a; --gold-deep:#f5c75a;
  --red:#ff5a6a; --red-soft:#3d1c26; --navy:#a9bcff; --navy-soft:#232d52;
  --up:#ff5d6b; --down:#62a0ff;
  --ok:#52c98d; --ok-soft:#173327; --warn:#f2b54a; --warn-soft:#3a2c14; --bad:#ff5d6b; --bad-soft:#3d1c26; --unk:#9a96a8; --unk-soft:#262a3c;
  --cloud-up:rgba(82,201,141,.16); --cloud-dn:rgba(255,93,107,.14);
  --shadow:0 1px 0 rgba(0,0,0,.3),0 8px 22px -10px rgba(0,0,0,.7);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.6 var(--f-body);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit}
a{color:var(--red)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:6px}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.up{color:var(--up)} .down{color:var(--down)}
h1,h2,h3{text-wrap:balance}

/* ── 상단 바 ── */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(8px);border-bottom:2px solid var(--gold)}
.bar .wrap{display:flex;align-items:center;gap:12px;min-height:56px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink);font-family:var(--f-display);font-size:19px;letter-spacing:.01em;margin-right:auto}
.brand svg{width:30px;height:24px}
.nav{display:flex;gap:4px}
.nav a{padding:6px 12px;border-radius:999px;text-decoration:none;color:var(--ink-soft);font-weight:700;font-size:14px}
.nav a[aria-current="page"]{background:var(--navy);color:var(--paper)}
:root[data-theme="dark"] .nav a[aria-current="page"]{color:#12172a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .nav a[aria-current="page"]{color:#12172a}}
.clocks{display:flex;gap:6px;flex-wrap:wrap}
@media (max-width:640px){.bar{position:static}}
.clock{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 11px;font-size:12.5px;color:var(--ink-soft);text-decoration:none;white-space:nowrap}
.clock b{color:var(--ink);font-weight:700}
.clock.kr.live{border-color:var(--warn);background:var(--warn-soft);color:var(--warn)}
.clock.us{border-color:var(--navy)}
.clock.us:hover{background:var(--navy-soft)}
.phase-banner{border-radius:12px;padding:10px 14px;font-size:14px;margin-bottom:18px;border:1px solid}
.phase-banner.intraday{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}
.phase-banner.holiday{background:var(--navy-soft);color:var(--navy);border-color:var(--navy)}
.phase-banner b{font-weight:700}
.theme-btn{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 10px;cursor:pointer;font-size:13px}

/* ── 히어로: 하늘과 성 ── */
.hero{position:relative;overflow:hidden;background:linear-gradient(180deg,var(--sky-top),var(--sky-bot));padding-block:36px 0}
.hero .stars{position:absolute;inset:0;opacity:0;pointer-events:none;background-image:radial-gradient(1.4px 1.4px at 12% 18%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 28% 32%,#fff 50%,transparent 51%),radial-gradient(1.6px 1.6px at 47% 12%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 63% 26%,#fff 50%,transparent 51%),radial-gradient(1.3px 1.3px at 81% 14%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 91% 38%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 6% 44%,#fff 50%,transparent 51%)}
:root[data-theme="dark"] .hero .stars{opacity:.85}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .hero .stars{opacity:.85}}
.cloud{position:absolute;background:var(--cloud);border-radius:999px;opacity:.9;filter:blur(.3px)}
.cloud::before,.cloud::after{content:"";position:absolute;background:inherit;border-radius:50%}
.cloud.c1{width:170px;height:44px;top:40px;left:4%;animation:drift 70s linear infinite}
.cloud.c1::before{width:80px;height:70px;left:24px;top:-34px}.cloud.c1::after{width:64px;height:54px;left:84px;top:-22px}
.cloud.c2{width:120px;height:32px;top:96px;left:58%;opacity:.75;animation:drift 95s linear infinite reverse}
.cloud.c2::before{width:56px;height:50px;left:18px;top:-24px}.cloud.c2::after{width:44px;height:38px;left:60px;top:-16px}
.cloud.c3{width:210px;height:50px;top:24px;right:-40px;opacity:.85;animation:drift 110s linear infinite}
.cloud.c3::before{width:96px;height:84px;left:30px;top:-40px}.cloud.c3::after{width:76px;height:62px;left:110px;top:-26px}
@keyframes drift{from{transform:translateX(0)}50%{transform:translateX(60px)}to{transform:translateX(0)}}
@media (prefers-reduced-motion:reduce){.cloud{animation:none!important}}
.hero-grid{position:relative;z-index:2;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:28px;align-items:end}
.hero-copy{padding-bottom:64px;min-width:0}
.ribbon{display:inline-block;position:relative;background:var(--red);color:#fff;font-weight:700;font-size:13px;letter-spacing:.08em;padding:5px 18px;margin-bottom:12px;box-shadow:0 2px 0 rgba(0,0,0,.18)}
.ribbon::before,.ribbon::after{content:"";position:absolute;top:0;border:14px solid var(--red);border-color:var(--red) transparent;filter:brightness(.8)}
.ribbon::before{left:-14px;border-left-color:transparent;border-width:14px 0 14px 14px;border-color:var(--red) var(--red) var(--red) transparent}
.ribbon::after{right:-14px;border-width:14px 14px 14px 0;border-color:var(--red) transparent var(--red) var(--red)}
.title{margin:0;font-family:var(--f-display);font-weight:400;font-size:clamp(40px,7.4vw,84px);line-height:1.02;color:var(--red);letter-spacing:-.01em;
  -webkit-text-stroke:2px #fff;paint-order:stroke fill;text-shadow:0 4px 0 #7a1020,0 8px 18px rgba(0,0,0,.25)}
.title .sub{display:block;font-size:.5em;color:#fff;-webkit-text-stroke:0;text-shadow:0 3px 0 rgba(29,45,92,.55)}
.lede{max-width:34em;margin:14px 0 18px;color:#10254d;font-weight:500}
:root[data-theme="dark"] .lede{color:#dbe4ff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .lede{color:#dbe4ff}}
.hero-stats{display:flex;flex-wrap:wrap;gap:10px}
.stat{background:color-mix(in srgb,var(--card) 88%,transparent);border:2px solid var(--gold);border-radius:14px;padding:8px 14px;min-width:112px;box-shadow:var(--shadow)}
.stat b{display:block;font-family:var(--f-num);font-size:24px;line-height:1.1;color:var(--ink)}
.stat span{font-size:12px;color:var(--ink-soft);letter-spacing:.03em}
.portrait{position:relative;margin:0 0 56px;justify-self:end;width:min(100%,430px)}
.frame{display:block;width:100%;padding:12px;border:0;cursor:zoom-in;border-radius:22px;
  background:linear-gradient(145deg,var(--gold-hi),var(--gold) 40%,var(--gold-deep) 70%,var(--gold-hi));box-shadow:0 18px 40px -16px rgba(0,0,0,.55),inset 0 0 0 2px rgba(255,255,255,.5)}
.frame img{display:block;width:100%;height:auto;max-width:100%;aspect-ratio:1/1;object-fit:contain;border-radius:12px;background:#f7efe0;border:3px solid #7a4d0c}
.portrait figcaption{text-align:center;font-size:12px;margin-top:8px;color:#10254d;font-weight:700;letter-spacing:.04em}
:root[data-theme="dark"] .portrait figcaption{color:#dbe4ff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .portrait figcaption{color:#dbe4ff}}
.castle{position:absolute;left:0;right:0;bottom:-1px;height:120px;z-index:1;width:100%}
.castle .far{fill:var(--castle-far)} .castle .near{fill:var(--castle-near)} .castle .win{fill:var(--window)} .castle .ground{fill:var(--paper)} .castle .flag{fill:var(--red)}
@media (max-width:820px){.hero-grid{grid-template-columns:1fr}.hero-copy{padding-bottom:8px}.portrait{justify-self:center;margin-bottom:96px}}

.demo-banner{margin-bottom:18px;background:var(--warn-soft);color:var(--warn);border:1px dashed var(--warn);border-radius:12px;padding:10px 14px;font-weight:700;margin-top:18px}

/* ── 섹션 공통 ── */
main{padding-block:22px 56px}
.view{display:grid;gap:18px}
.sec-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.sec-head h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:28px;color:var(--ink)}
.sec-head p{margin:0;color:var(--ink-soft);font-size:14px}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--gold-deep);font-weight:700}

/* 필터 */
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--paper-2);border:1px solid var(--line);border-radius:16px;padding:12px}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:none;padding:5px 12px;border-radius:999px;cursor:pointer;font-size:13px;font-weight:700;color:var(--ink-soft)}
.seg button[aria-pressed="true"]{background:var(--gold);color:#3a2413}
.filters input[type=search],.filters select{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;font:inherit;font-size:14px;color:var(--ink);min-width:0}
.filters input[type=search]{flex:1 1 180px}
.toggle{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;cursor:pointer;user-select:none}
.toggle input{accent-color:var(--red);width:16px;height:16px}
.regime-pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:700;cursor:pointer;color:var(--ink-soft)}
.pill[aria-pressed="true"]{border-color:var(--navy);background:var(--navy);color:var(--paper)}
.count-line{font-size:13px;color:var(--ink-soft)}

/* 종목 카드 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{display:grid;gap:10px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;cursor:pointer;box-shadow:var(--shadow);transition:transform .15s,border-color .15s;min-width:0}
.card:hover{transform:translateY(-2px);border-color:var(--gold)}
.card-top{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:start}
.rank{font-family:var(--f-num);font-size:12px;color:var(--ink-faint);padding-top:3px;min-width:2.4em}
.nm b{display:block;font-size:17px;line-height:1.25;overflow-wrap:anywhere}
.nm small{color:var(--ink-soft);font-size:12px}
.px{text-align:right;font-family:var(--f-num);font-size:14px;line-height:1.3}
.px small{display:block;font-size:12px}
.regime{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;border-radius:8px;padding:3px 9px;justify-self:start}
.rg-uptrend_pullback{background:color-mix(in srgb,var(--gold) 24%,transparent);color:var(--gold-deep)}
.rg-reversal{background:var(--ok-soft);color:var(--ok)}
.rg-uptrend{background:var(--navy-soft);color:var(--navy)}
.rg-sideways{background:var(--unk-soft);color:var(--unk)}
.rg-downtrend{background:var(--bad-soft);color:var(--bad)}
.rg-pending{background:var(--unk-soft);color:var(--unk)}
.chips{display:flex;flex-wrap:wrap;gap:5px;min-height:24px}
.chip{font-size:11.5px;font-weight:700;border-radius:6px;padding:2px 7px;border:1px solid}
.g-bounce{color:var(--gold-deep);border-color:color-mix(in srgb,var(--gold) 60%,transparent);background:color-mix(in srgb,var(--gold) 12%,transparent)}
.g-oversold{color:var(--navy);border-color:color-mix(in srgb,var(--navy) 40%,transparent);background:var(--navy-soft)}
.g-breakout{color:var(--red);border-color:color-mix(in srgb,var(--red) 40%,transparent);background:var(--red-soft)}
.chip.none{color:var(--ink-faint);border-color:var(--line);background:none;font-weight:500}
.score-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center}
.meter{position:relative;height:10px;border-radius:999px;background:var(--paper-2);border:1px solid var(--line);overflow:hidden}
.meter span{position:absolute;inset:0 auto 0 0;border-radius:999px;background:linear-gradient(90deg,var(--gold-deep),var(--gold),var(--gold-hi))}
.meter-label{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-soft);margin-bottom:4px}
.meter-label b{font-family:var(--f-num);color:var(--ink);font-size:13px}
.coin{display:grid;place-items:center;width:52px;height:52px;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--gold-hi),var(--gold) 55%,var(--gold-deep));color:#3a2413;box-shadow:inset 0 0 0 3px rgba(255,255,255,.35),0 3px 8px -3px rgba(0,0,0,.4);text-align:center;line-height:1}
.coin b{font-family:var(--f-num);font-size:18px}
.coin small{display:block;font-size:9.5px;font-weight:700;letter-spacing:.04em}
.more{justify-self:center;border:2px solid var(--gold);background:var(--card);border-radius:999px;padding:9px 22px;font-weight:700;cursor:pointer}
.empty{padding:28px;text-align:center;color:var(--ink-soft);border:1px dashed var(--line);border-radius:16px}

/* ── 상세 ── */
.back{border:0;background:none;color:var(--ink-soft);cursor:pointer;font-weight:700;padding:4px 0;justify-self:start}
.d-head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:end;border-bottom:2px solid var(--gold);padding-bottom:14px}
.d-head h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:clamp(30px,5vw,44px);line-height:1.05}
.d-meta{color:var(--ink-soft);font-size:13.5px;display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:6px}
.d-price{text-align:right;font-family:var(--f-num);font-size:26px;line-height:1.1}
.d-price small{display:block;font-size:14px}
.medals{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.medal{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:grid;gap:2px;min-width:0}
.medal span{font-size:12px;color:var(--ink-soft);font-weight:700;letter-spacing:.03em}
.medal b{font-family:var(--f-num);font-size:26px;line-height:1.1}
.medal small{font-size:11.5px;color:var(--ink-faint)}
.medal.total{background:linear-gradient(160deg,color-mix(in srgb,var(--gold) 30%,var(--card)),var(--card));border:2px solid var(--gold)}
@media (max-width:640px){.medals{grid-template-columns:repeat(2,minmax(0,1fr))}.d-head{grid-template-columns:1fr}.d-price{text-align:left}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;min-width:0}
.panel h3{margin:0 0 10px;font-size:17px}
.chart-box{position:relative}
.chart-box canvas{display:block;width:100%;height:360px;touch-action:pan-y}
@media (max-width:640px){.chart-box canvas{height:290px}}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink-soft);margin-top:8px}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
.legend i.box{height:10px;width:12px}
.tip{position:absolute;pointer-events:none;background:var(--paper);border:1px solid var(--gold);border-radius:10px;padding:6px 9px;font-size:12px;line-height:1.45;box-shadow:var(--shadow);min-width:150px;z-index:3}
.tip b{font-family:var(--f-num)}
.two{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px}
@media (max-width:860px){.two{grid-template-columns:1fr}}
.sig-group{display:grid;gap:6px;margin-bottom:12px}
.sig-group h4{margin:0;font-size:12.5px;letter-spacing:.06em;color:var(--ink-soft)}
.sig{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:8px;align-items:start;padding:7px 9px;border-radius:10px;border:1px solid var(--line)}
.sig.hit{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 10%,transparent)}
.sig .mk{font-weight:700;text-align:center}
.sig.hit .mk{color:var(--gold-deep)} .sig:not(.hit){opacity:.72}
.sig .t b{font-size:14px}
.sig .t small{display:block;color:var(--ink-soft);font-size:12px;line-height:1.45}
.sig .p{font-family:var(--f-num);font-size:13px;white-space:nowrap}
.regime-card{border-radius:14px;padding:14px;display:grid;gap:6px}
.regime-card h4{margin:0;font-size:20px;font-family:var(--f-display);font-weight:400}
.regime-card ul{margin:0;padding-left:18px;font-size:13px}
.kv{display:grid;grid-template-columns:auto auto;gap:4px 14px;font-size:13px;margin-top:10px}
.kv dt{color:var(--ink-soft)} .kv dd{margin:0;text-align:right;font-family:var(--f-num)}
.calc{font-size:12.5px;color:var(--ink-soft);border-top:1px dashed var(--line);padding-top:8px;margin-top:6px}

/* 페이지 넘김 (1/2 재무 → 2/2 악재) */
.pager{display:grid;grid-template-columns:1fr 1fr;border:2px solid var(--gold);border-radius:16px;overflow:hidden}
.pager button{border:0;background:var(--card);padding:12px 10px;cursor:pointer;display:grid;gap:0;text-align:left;padding-left:16px}
.pager button span{font-size:12px;color:var(--ink-soft);font-weight:700;letter-spacing:.05em}
.pager button b{font-size:17px}
.pager button[aria-current="step"]{background:var(--gold);color:#3a2413}
.pager button[aria-current="step"] span{color:#5b3b0c}
.page-foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.btn{border:2px solid var(--gold);background:var(--card);border-radius:999px;padding:9px 18px;font-weight:700;cursor:pointer}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff}

.score-hero{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center}
.shield{width:92px;height:104px;display:grid;place-items:center;position:relative}
.shield svg{position:absolute;inset:0;width:100%;height:100%}
.shield .sv{position:relative;text-align:center;line-height:1;color:#3a2413}
.shield .sv b{font-family:var(--f-num);font-size:30px;display:block}
.shield .sv small{font-size:12px;font-weight:700}
.score-hero p{margin:0;color:var(--ink-soft);font-size:14px}
.score-hero h3{margin:0 0 4px;font-size:22px;font-family:var(--f-display);font-weight:400}
.items{display:grid;gap:8px}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;border:1px solid var(--line);border-radius:12px;padding:11px 13px;background:var(--card)}
.item .nm2 b{font-size:15px}
.item .nm2 small{display:block;color:var(--ink-soft);font-size:12.5px;line-height:1.45}
.item .val{text-align:right;font-family:var(--f-num);font-size:15px}
.item .val small{display:block;font-size:11.5px;color:var(--ink-faint);font-family:var(--f-body)}
.item .bar2{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center}
.item .rule{grid-column:1/-1;font-size:12px;color:var(--ink-faint)}
.item.muted{opacity:.65}
.status{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px;white-space:nowrap}
.st-ok{background:var(--ok-soft);color:var(--ok)} .st-warn{background:var(--warn-soft);color:var(--warn)}
.st-bad{background:var(--bad-soft);color:var(--bad)} .st-unknown,.st-na{background:var(--unk-soft);color:var(--unk)}
.item .detail{grid-column:1/-1;font-size:13.5px}
.item .links{grid-column:1/-1;display:flex;flex-direction:column;gap:2px;font-size:12.5px}
.info-note{font-size:13px;color:var(--ink-soft);background:var(--paper-2);border-radius:12px;padding:10px 12px}

/* ── 검색 ── */
.search-box{position:relative;max-width:640px}
.search-box input{width:100%;font:inherit;font-size:20px;padding:14px 20px 14px 50px;border-radius:999px;border:3px solid var(--gold);background:var(--card);color:var(--ink)}
.search-box svg{position:absolute;left:18px;top:50%;transform:translateY(-50%);width:22px;height:22px;color:var(--gold-deep)}
.sugg{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);z-index:5;overflow:hidden;margin:0;padding:4px;list-style:none}
.sugg li{padding:8px 12px;border-radius:10px;cursor:pointer;display:flex;justify-content:space-between;gap:10px}
.sugg li[aria-selected="true"],.sugg li:hover{background:var(--paper-2)}
.sugg small{color:var(--ink-soft)}
.verdict{display:grid;grid-template-columns:auto minmax(0,1fr);gap:22px;align-items:center;background:linear-gradient(170deg,color-mix(in srgb,var(--gold) 18%,var(--card)),var(--card) 60%);border:2px solid var(--gold);border-radius:22px;padding:22px}
@media (max-width:640px){.verdict{grid-template-columns:1fr;justify-items:start}}
.big-coin{width:150px;height:150px;border-radius:50%;display:grid;place-items:center;text-align:center;background:radial-gradient(circle at 35% 28%,var(--gold-hi),var(--gold) 55%,var(--gold-deep));color:#3a2413;box-shadow:inset 0 0 0 6px rgba(255,255,255,.35),inset 0 0 0 10px rgba(122,77,12,.35),0 14px 30px -12px rgba(0,0,0,.5);line-height:1}
.big-coin b{font-family:var(--f-num);font-size:54px;display:block}
.big-coin small{font-size:13px;font-weight:700}
.verdict h3{margin:0;font-family:var(--f-display);font-weight:400;font-size:30px}
.quote{font-size:17px;font-weight:700;color:var(--red);margin:4px 0 12px}
.breakdown{display:grid;gap:8px}
.bd{display:grid;grid-template-columns:5.5em minmax(0,1fr) 7.2em;gap:10px;align-items:center;font-size:13.5px}
.bd .num{text-align:right}
.top-list{display:grid;gap:6px;counter-reset:t}
.top-list button{display:grid;grid-template-columns:2em minmax(0,1fr) auto auto;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:9px 12px;cursor:pointer}
.top-list button:hover{border-color:var(--gold)}

/* ── 규칙 ── */
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;font-size:13.5px;background:var(--card)}
th,td{padding:8px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{white-space:nowrap;background:var(--paper-2);font-size:12.5px;letter-spacing:.04em;color:var(--ink-soft)}
td.n{text-align:right;font-family:var(--f-num);white-space:nowrap}
.foot{border-top:2px solid var(--gold);padding-block:18px 36px;color:var(--ink-soft);font-size:12.5px}
dialog{border:0;padding:0;background:transparent;max-width:min(96vw,980px)}
dialog::backdrop{background:rgba(8,12,30,.78)}
dialog img{display:block;height:auto;max-width:100%;max-height:92vh;border-radius:12px;border:6px solid var(--gold)}
dialog form{text-align:right;margin-bottom:6px}
dialog button{border:0;background:var(--gold);color:#3a2413;font-weight:700;border-radius:999px;padding:6px 14px;cursor:pointer}
/* ── v2 내용용 추가 ── */
:root{--line-soft:color-mix(in srgb,var(--line) 55%,transparent)}
.soft{color:var(--ink-soft)} .faint{color:var(--ink-faint)}
.note{font-size:13px;color:var(--ink-soft)}
.banner{border-radius:12px;padding:10px 14px;font-size:14px;margin:0 0 12px;border:1px solid var(--warn);background:var(--warn-soft);color:var(--warn)}
.banner.demo{border-style:dashed;font-weight:700;margin-top:18px}
.clock.refresh{border-color:var(--gold);color:var(--gold-deep);font-weight:700}
.clock.refresh:hover{background:color-mix(in srgb,var(--gold) 18%,var(--card))}
.mkt-panel{display:grid;grid-template-columns:auto minmax(0,1fr);gap:20px;align-items:center;background:linear-gradient(170deg,color-mix(in srgb,var(--gold) 16%,var(--card)),var(--card) 60%);border:2px solid var(--gold);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
@media (max-width:640px){.mkt-panel{grid-template-columns:1fr;justify-items:start}}
.mkt-panel .big-coin{width:128px;height:128px}
.mkt-panel .big-coin b{font-size:30px}
.mkt-panel h3{margin:0;font-family:var(--f-display);font-weight:400;font-size:26px}
.mkt-line{margin:2px 0 0;font-size:15px}
.mkt-line b{font-family:var(--f-num)}
.bbar{position:relative;height:12px;background:var(--paper-2);border:1px solid var(--line);border-radius:999px;margin:12px 0 22px;max-width:560px}
.bbar span{position:absolute;inset:0 auto 0 0;border-radius:999px;background:linear-gradient(90deg,var(--gold-deep),var(--gold),var(--gold-hi))}
.bbar i{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink-faint)}
.bbar em{position:absolute;top:15px;font-style:normal;font-size:11px;color:var(--ink-faint);transform:translateX(-50%)}
.spark{display:block;width:100%;max-width:560px;height:54px}
.facts{display:grid;gap:4px;margin:10px 0 0;padding:0;list-style:none;font-size:14px}
.facts li:first-child{font-weight:700;color:var(--red);font-size:15.5px}
.tabs{display:inline-flex;flex-wrap:wrap;gap:4px;background:var(--card);border:2px solid var(--gold);border-radius:999px;padding:4px;justify-self:start}
.tabs button{border:0;background:none;padding:8px 18px;border-radius:999px;cursor:pointer;font-size:15px;font-weight:700;color:var(--ink-soft)}
.tabs button[aria-selected="true"]{background:var(--gold);color:#3a2413}
.card .hist{font-size:12px;color:var(--ink-soft);margin-top:5px;display:block}
.coin.gA{box-shadow:inset 0 0 0 3px rgba(255,255,255,.45),0 0 0 3px var(--red),0 3px 8px -3px rgba(0,0,0,.4)}
.coin.gD,.coin.gN,.grade.gD,.grade.gN{filter:grayscale(.85);opacity:.8}
.grade{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;vertical-align:middle;margin-left:6px;font-family:var(--f-num);font-size:16px;font-weight:600;background:radial-gradient(circle at 35% 30%,var(--gold-hi),var(--gold) 55%,var(--gold-deep));color:#3a2413}
.check{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.check li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;padding:8px 10px;border-radius:10px;border:1px solid var(--line)}
.check li.on{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 10%,transparent)}
.check li:not(.on){opacity:.75}
.check .mk{font-weight:700;text-align:center;color:var(--ink-faint)}
.check li.on .mk{color:var(--gold-deep)}
.check small{display:block;color:var(--ink-soft);font-size:12.5px;line-height:1.45}
.kv{grid-template-columns:auto 1fr}
.kv dd{text-align:left;font-family:var(--f-body)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:14px}
.panel h4{margin:18px 0 6px;font-size:14.5px;color:var(--gold-deep)}
.panel p{margin:0 0 8px}
.item small{display:block;color:var(--ink-soft);font-size:12.5px;line-height:1.45}
.item .full{grid-column:1/-1;font-size:13.5px}
.item .full.meter{height:8px}
.pager button b{display:block}
.rules-list{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.rules-list li{padding:8px 12px;border-radius:10px;border:1px solid var(--gold);background:color-mix(in srgb,var(--gold) 10%,transparent);font-weight:500}
details.note{background:var(--paper-2);border-radius:12px;padding:10px 12px}

/* ── v3: 순서 넘기기 · 판정 · 순위 ── */
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:2px solid var(--gold);border-radius:16px;overflow:hidden;background:var(--card)}
.steps button{border:0;border-right:1px solid var(--line);background:none;padding:10px 8px 10px 14px;cursor:pointer;text-align:left;min-width:0}
.steps button:last-child{border-right:0}
.steps button span{display:block;font-size:11.5px;color:var(--ink-soft);font-weight:700;letter-spacing:.05em}
.steps button b{display:block;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.steps button[aria-current="step"]{background:var(--gold);color:#3a2413}
.steps button[aria-current="step"] span{color:#5b3b0c}
@media (max-width:640px){.steps{grid-template-columns:repeat(2,minmax(0,1fr))}.steps button:nth-child(2){border-right:0}.steps button:nth-child(-n+2){border-bottom:1px solid var(--line)}}
.vd{display:inline-flex;align-items:center;font-size:11.5px;font-weight:700;border-radius:999px;padding:2px 9px;white-space:nowrap}
.vd-go{background:var(--ok);color:#fff} .vd-veto{background:var(--bad);color:#fff} .vd-weak{background:var(--warn-soft);color:var(--warn)} .vd-none{background:var(--unk-soft);color:var(--unk)}
.g-new{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,transparent);background:var(--ok-soft)}
.chip.thin{color:var(--unk);border-color:var(--line);background:var(--unk-soft)}
.final{display:grid;grid-template-columns:auto minmax(0,1fr);gap:20px;align-items:center;border-radius:22px;padding:22px;border:2px solid var(--line);background:var(--card);box-shadow:var(--shadow)}
.final.go{border-color:var(--ok);background:linear-gradient(170deg,var(--ok-soft),var(--card) 65%)}
.final.veto{border-color:var(--bad);background:linear-gradient(170deg,var(--bad-soft),var(--card) 65%)}
.final.weak{border-color:var(--warn);background:linear-gradient(170deg,var(--warn-soft),var(--card) 65%)}
.final .stamp{width:132px;height:132px;border-radius:50%;display:grid;place-items:center;text-align:center;font-family:var(--f-display);font-size:25px;line-height:1.15;color:#fff;background:var(--unk);box-shadow:inset 0 0 0 5px rgba(255,255,255,.35),0 12px 26px -12px rgba(0,0,0,.5)}
.final.go .stamp{background:var(--ok)} .final.veto .stamp{background:var(--bad)} .final.weak .stamp{background:var(--warn)}
.final h3{margin:0 0 6px;font-family:var(--f-display);font-weight:400;font-size:26px}
.final p{margin:0 0 6px}
@media (max-width:640px){.final{grid-template-columns:1fr;justify-items:start}}
.sumrow{display:grid;grid-template-columns:5.5em minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.sumrow b{font-size:14.5px}
.rankline{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 10px}
.rankbox{border:1px solid var(--gold);background:color-mix(in srgb,var(--gold) 12%,var(--card));border-radius:12px;padding:7px 12px;font-size:13px;color:var(--ink-soft)}
.rankbox b{font-family:var(--f-num);font-size:18px;color:var(--ink)}
.desc{margin:0;padding-left:18px;font-size:14px}
.desc li{margin:2px 0}
.tw td:first-child{white-space:nowrap}

/* ════ v4 겉모습: 처음부터 끝까지 '깔끔한 증권 앱' ════
   흰 카드, 큰 숫자, 파란 포인트 하나. 버거대왕은 머리 오른쪽에 둥근 그림으로만 등장한다. */
:root{
  --paper:#f2f4f6; --paper-2:#f7f8fa; --card:#ffffff; --line:#e5e8eb; --line-soft:#eef0f3;
  --ink:#191f28; --ink-soft:#4e5968; --ink-faint:#8b95a1;
  --gold:#ffc928; --gold-hi:#ffe27a; --gold-deep:#a86f00; --red:#e3193c; --red-soft:#ffeef0; --navy:#3182f6; --navy-soft:#e8f3ff;
  --up:#f04452; --down:#3182f6; --ok:#0c9a55; --ok-soft:#e3f8ec; --warn:#c77700; --warn-soft:#fff4dc; --bad:#e3193c; --bad-soft:#ffeef0; --unk:#6b7684; --unk-soft:#eef0f3;
  --cloud-up:rgba(12,154,85,.13); --cloud-dn:rgba(240,68,82,.11);
  --shadow:0 1px 2px rgba(25,31,40,.04),0 8px 22px -14px rgba(25,31,40,.22); --sticker:#201408;
  --f-pop:"Jua","IBM Plex Sans KR",sans-serif; --f-num:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#15161b; --paper-2:#24262e; --card:#1e2027; --line:#30333d; --line-soft:#282b34;
  --ink:#f2f4f6; --ink-soft:#b0b8c1; --ink-faint:#7d8792;
  --gold:#ffc928; --gold-hi:#ffe27a; --gold-deep:#ffd45c; --red:#ff5a6e; --red-soft:#3a1d25; --navy:#5a9bff; --navy-soft:#1b2a44;
  --up:#ff5a6e; --down:#5a9bff; --ok:#2bc77f; --ok-soft:#153526; --warn:#f2b54a; --warn-soft:#3a2c14; --bad:#ff5a6e; --bad-soft:#3a1d25; --unk:#9aa3ad; --unk-soft:#2a2d36;
  --cloud-up:rgba(43,199,127,.16); --cloud-dn:rgba(255,90,110,.14);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 24px -14px rgba(0,0,0,.8); --sticker:#0b0c10; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#15161b; --paper-2:#24262e; --card:#1e2027; --line:#30333d; --line-soft:#282b34;
  --ink:#f2f4f6; --ink-soft:#b0b8c1; --ink-faint:#7d8792;
  --gold:#ffc928; --gold-hi:#ffe27a; --gold-deep:#ffd45c; --red:#ff5a6e; --red-soft:#3a1d25; --navy:#5a9bff; --navy-soft:#1b2a44;
  --up:#ff5a6e; --down:#5a9bff; --ok:#2bc77f; --ok-soft:#153526; --warn:#f2b54a; --warn-soft:#3a2c14; --bad:#ff5a6e; --bad-soft:#3a1d25; --unk:#9aa3ad; --unk-soft:#2a2d36;
  --cloud-up:rgba(43,199,127,.16); --cloud-dn:rgba(255,90,110,.14);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 24px -14px rgba(0,0,0,.8); --sticker:#0b0c10; color-scheme:dark;
}
body{font-size:15px;letter-spacing:-.01em}
a{color:var(--navy)}
:focus-visible{outline:3px solid var(--navy);outline-offset:2px;border-radius:8px}
.wrap{max-width:1120px}
.num,.px,.d-price{font-variant-numeric:tabular-nums;font-weight:600}

/* 상단 바 */
.bar{background:color-mix(in srgb,var(--card) 92%,transparent);border-bottom:1px solid var(--line)}
.brand{font-family:var(--f-body);font-weight:700;font-size:17px;letter-spacing:-.02em}
.nav a{font-weight:600;border-radius:10px;padding:7px 12px}
.nav a[aria-current="page"]{background:var(--ink);color:var(--card)!important}
.clock{border:0;background:var(--paper);border-radius:10px;padding:6px 11px}
.clock.kr.live{background:var(--warn-soft);color:var(--warn)}
.clock.us{border:0;color:var(--navy);background:var(--navy-soft)} .clock.us b{color:var(--navy)}
.clock.refresh{border:0;background:var(--navy);color:#fff}
.clock.refresh:hover{background:color-mix(in srgb,var(--navy) 85%,#000)}
.theme-btn{border:0;background:var(--paper);border-radius:10px;padding:6px 10px}

/* 머리: 증권 앱 */
.hero{background:linear-gradient(180deg,var(--navy-soft),var(--paper));padding-block:44px 30px}
.hero .stars,.hero .cloud,.hero .castle{display:none}
.hero-grid{align-items:center;grid-template-columns:minmax(0,1.3fr) minmax(0,.7fr)}
.hero-copy{padding-bottom:0}
.ribbon{background:none;color:var(--navy);font-weight:700;font-size:15px;letter-spacing:0;padding:0;box-shadow:none;margin-bottom:12px}
.ribbon::before,.ribbon::after{display:none}
.title{font-family:var(--f-body);font-weight:700;color:var(--ink);-webkit-text-stroke:0;text-shadow:none;font-size:clamp(30px,5vw,50px);line-height:1.2;letter-spacing:-.03em}
.lede,:root[data-theme="dark"] .lede{color:var(--ink-soft)!important;font-weight:400;font-size:16.5px;margin:14px 0 22px}
.stat{background:var(--card);border:0;border-radius:18px;box-shadow:var(--shadow);padding:12px 18px;min-width:120px}
.stat b{font-family:var(--f-body);font-weight:700;font-size:26px;letter-spacing:-.02em;color:var(--ink)}
.stat span{font-size:13px;color:var(--ink-faint);letter-spacing:0}
.portrait{margin:0;width:min(100%,320px)}
.frame{padding:0;border:0;border-radius:32px;background:var(--card);overflow:hidden;box-shadow:0 18px 40px -20px color-mix(in srgb,var(--navy) 70%,transparent)}
.frame img{border:0;border-radius:0;background:var(--card)}
.portrait figcaption,:root[data-theme="dark"] .portrait figcaption{font-weight:400;font-size:12.5px;color:var(--ink-faint)!important;margin-top:12px;letter-spacing:0}
@media (max-width:820px){.hero-grid{grid-template-columns:1fr}.portrait{justify-self:start;margin:22px 0 0;width:min(60%,220px)}}

/* 아래: 증권 앱 */
main{padding-block:26px 64px}
.view{gap:16px}
.sec-head{margin-top:8px}
.sec-head h2{font-family:var(--f-body);font-weight:700;font-size:22px;letter-spacing:-.02em}
.sec-head p{color:var(--ink-faint)}
.eyebrow{color:var(--navy);letter-spacing:0;font-size:13px}
.banner{border:0;border-radius:14px;margin-bottom:10px}
.banner.demo{border:0;font-weight:600}
.panel,.card,.mkt-panel,.final{border:0;box-shadow:var(--shadow);background:var(--card)}
.panel{border-radius:22px;padding:22px}
.panel h3{font-size:17px;font-weight:700;margin-bottom:12px}
.panel h4{color:var(--ink);font-size:14.5px;margin-top:22px}
.mkt-panel{border-radius:24px;padding:24px;background:var(--card)}
.mkt-panel h3{font-family:var(--f-body);font-weight:700;font-size:22px}
.facts li:first-child{color:var(--ink);font-weight:700}
.big-coin,.coin,.final .stamp{border:0;box-shadow:none}
.big-coin{background:var(--navy-soft);color:var(--navy)}
.mkt-panel .big-coin{width:132px;height:132px}
.mkt-panel .big-coin b{font-family:var(--f-body);font-weight:700;font-size:32px;letter-spacing:-.03em}
.big-coin small{font-weight:600;font-size:13px}
.bbar{height:10px;border:0;background:var(--line)}
.bbar span{background:var(--navy)}

<script>
(function(){
"use strict";
const R = window.RADAR || {meta:{}, stocks:[]};
const M = R.meta, S = R.stocks, T = M.table || {}, RU = M.rules || {};
const byCode = Object.fromEntries(S.map(s=>[s.code,s]));
const $ = (s,el=document)=>el.querySelector(s);
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const FT = M.fin_text || {}, RT = M.risk_text || {};
S.forEach(s=>{ (s.fin?.items||[]).forEach(i=>{ i.explain=FT[i.key]?.explain||""; });
               (s.risk?.items||[]).forEach(i=>{ i.explain=RT[i.key]||""; }); });

const won = v => v==null? "–" : Math.round(v).toLocaleString("ko-KR");
const cnt = v => v==null? "–" : Number(v).toLocaleString("ko-KR");
const pct = (v,d=1) => v==null? "–" : (v>0?"+":"")+Number(v).toFixed(d)+"%";
const eok = v => { if(v==null) return "–"; if(v>=10000) return (v/10000).toFixed(v>=100000?0:1)+"조"; return Math.round(v).toLocaleString("ko-KR")+"억"; };
const cls = v => v==null? "" : v>0? "up" : v<0? "down" : "";
const mktName = m => m==="KOSPI"?"코스피":"코스닥";

/* 초성 검색 */
const CHO = "ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ";
const chosung = s => [...s].map(ch=>{const c=ch.charCodeAt(0)-0xAC00; return (c>=0&&c<11172)? CHO[Math.floor(c/588)] : ch;}).join("");
S.forEach(s=>{ s._cho = chosung(s.name); s._lc = s.name.toLowerCase(); });
function matches(s,q){ q=(q||"").trim().toLowerCase(); if(!q) return true; if(/^[ㄱ-ㅎ]+$/.test(q)) return s._cho.includes(q); return s._lc.includes(q) || s.code.toLowerCase().startsWith(q); }

/* 차트 파일 */
const chartCache=window.__CHARTS||{}, chartWait={};
window.__chart=(code,data)=>{ chartCache[code]=data; (chartWait[code]||[]).forEach(f=>f(data)); delete chartWait[code]; };
function loadChart(code,cb){
  if(chartCache[code]) return cb(chartCache[code]);
  if(chartWait[code]){ chartWait[code].push(cb); return; }
  chartWait[code]=[cb];
  const sc=document.createElement("script"); sc.src="c/"+code+".js";
  sc.onerror=()=>{ (chartWait[code]||[]).forEach(f=>f(null)); delete chartWait[code]; };
  document.head.appendChild(sc);
}

/* 테마 */
const root=document.documentElement;
const isDark=()=>{ const t=root.getAttribute("data-theme"); return t? t==="dark" : matchMedia("(prefers-color-scheme: dark)").matches; };
const syncTheme=()=>{ $("#themeBtn").textContent = isDark()? "☀️ 낮":"🌙 밤"; };
$("#themeBtn").addEventListener("click",()=>{ root.setAttribute("data-theme", isDark()?"light":"dark"); try{localStorage.setItem("bk-theme",root.getAttribute("data-theme"))}catch(e){} syncTheme(); redrawAll(); });
try{ const t=localStorage.getItem("bk-theme"); if(t) root.setAttribute("data-theme",t);}catch(e){}
syncTheme();
$("#portraitBtn").addEventListener("click",()=>{ const d=$("#portraitDlg"); if(d.showModal) d.showModal(); });

/* 과거 성과 문장 */
const base = () => (T.baseline||{}).all || null;
const TG = s => (T.groups||{})[s.group] || T;
function histShort(h){ if(!h) return "과거 기록 없음"; return `과거 ${cnt(h.n)}번 · 5일 승률 ${h.w5}% · 평균 ${pct(h.m5)}`; }
function gradeHtml(g){ return `<span class="grade g${g||"N"}" title="${g?`과거 같은 상태의 5일 승률 등급 ${g}`:"표본이 적어 등급 없음"}">${g||"–"}</span>`; }
const sigNames = (flags,e) => [flags.rsi?`RSI ${e?.rsi ?? ""}`.trim():null, flags.bb?"볼린저 하단":null, flags.gap?`이격 ${e?.gap ?? ""}%`.replace(" %","%"):null].filter(Boolean).join(" · ");
const when = ago => ago===0? "오늘" : ago+"거래일 전";
const BUCKET = {lt30:"30% 미만", "30_50":"30~50%", ge50:"50% 이상"};

/* 상단 정보 */
function header(){
  const ph=M.phase||{};
  const k=$("#krClock"); k.innerHTML = `<b>국장</b> ${esc(ph.now||"")} ${esc(ph.label||"")}`; if(ph.key==="intraday") k.classList.add("live");
  const rl=$("#refreshLink"); if(M.refresh_url) rl.href=M.refresh_url; else rl.hidden=true;
  const a=$("#usLink"); if(!M.us_url){ a.hidden=true; } else {
    a.href=M.us_url;
    const two=n=>String(n).padStart(2,"0");
    fetch(M.us_url,{cache:"no-store"}).then(r=>{ if(!r.ok) throw 0; const lm=r.headers.get("last-modified"); return r.text().then(t=>({t,lm})); })
      .then(({t,lm})=>{ let d=lm? new Date(lm):null; if(!d||isNaN(d)){ const m=t.match(/(\d{4})년\s*(\d{2})월\s*(\d{2})일\s*(\d{2}):(\d{2})\s*기준/); if(m) d=new Date(Date.UTC(+m[1],m[2]-1,+m[3],+m[4],+m[5])); }
        if(d&&!isNaN(d)) $("#usClock").textContent=`${two(d.getMonth()+1)}/${two(d.getDate())} ${two(d.getHours())}:${two(d.getMinutes())}`; }).catch(()=>{});
  }
  const mk=M.market||{};
  $("#lede").textContent = `코스피 전 종목과 코스닥 150을 장중 30분마다 살펴봅니다. 과거 같은 상태의 성과, 재무 순위, 악재 점검까지 한 번에 볼 수 있어요.`;
  $("#heroStats").innerHTML = [[cnt(S.length),"살펴본 종목"],[M.os_count??0,"과매도 후보"],[M.go_count??0,"조건 통과"],[mk.breadth!=null?mk.breadth+"%":"–","시장 폭"]].map(([v,l])=>`<div class="stat"><b>${v}</b><span>${l}</span></div>`).join("");
  $("#asOf").textContent = `${M.as_of||""} ${ph.label||""} 기준 · 전 종목 중 20일선 위에 있는 종목 비율`;
  const b=[];

const live=[];
function niceStep(x){ const p=Math.pow(10,Math.floor(Math.log10(x))); const f=x/p; return (f<1.5?1:f<3?2:f<7?5:10)*p; }
function drawChart(cv,ch,hover){

  for(let v=Math.ceil(lo/step)*step; v<hi; v+=step){ const y=Math.round(Y(v))+.5; g.beginPath(); g.moveTo(padL,y); g.lineTo(W-padR,y); g.stroke(); g.fillText(won(v),W-padR+5,y); }
  for(let i=1;i<total;i++){ const a0=ch.sa[i-1],b0=ch.sb[i-1],a1=ch.sa[i],b1=ch.sb[i]; if([a0,b0,a1,b1].some(v=>v==null)) continue;
    g.fillStyle=(a1>=b1)?cssv("--cloud-up"):cssv("--cloud-dn"); g.beginPath(); g.moveTo(X(i-1),Y(a0)); g.lineTo(X(i),Y(a1)); g.lineTo(X(i),Y(b1)); g.lineTo(X(i-1),Y(b0)); g.closePath(); g.fill(); }
  const line=(arr,color,w,dash)=>{ g.strokeStyle=color; g.lineWidth=w; g.setLineDash(dash||[]); g.beginPath(); let on=false; for(let i=0;i<n;i++){ const v=arr[i]; if(v==null){on=false;continue;} on? g.lineTo(X(i),Y(v)) : g.moveTo(X(i),Y(v)); on=true; } g.stroke(); g.setLineDash([]); };
  line(ch.ma120,cssv("--navy"),1.4); line(ch.ma60,cssv("--ink-faint"),1.1); line(ch.ma20,cssv("--gold"),1.6); line(ch.bbl,cssv("--gold"),1,[4,3]);
  const bw=Math.max(1,Math.min(8,xw*.66));
  for(let i=0;i<n;i++){ const o=ch.o[i],c=ch.c[i],col=c>=o?up:dn,x=X(i); g.strokeStyle=col; g.fillStyle=col; g.lineWidth=1;
    g.beginPath(); g.moveTo(Math.round(x)+.5,Y(ch.h[i])); g.lineTo(Math.round(x)+.5,Y(ch.l[i])); g.stroke();
    const y1=Y(Math.max(o,c)), y2=Y(Math.min(o,c)); g.fillRect(x-bw/2,y1,bw,Math.max(1,y2-y1)); }
  const vmax=Math.max(...ch.v,1), vt=pb+6; g.globalAlpha=.4;
  for(let i=0;i<n;i++){ const h=ch.v[i]/vmax*(volH-2); g.fillStyle=ch.c[i]>=ch.o[i]?up:dn; g.fillRect(X(i)-bw/2,vt+volH-h,bw,h); } g.globalAlpha=1;

function mountChart(box,ch){

function histTable(h, bl, blName){
  if(!h) return `<p class="note">과거 기록이 없어요.</p>`;
  const row=(lab,x)=>`<tr><td>${lab}</td><td class="n">${x?cnt(x.n):"–"}</td>${[5,10,20].map(d=>`<td class="n">${x&&x["w"+d]!=null?x["w"+d]+"%":"–"}</td><td class="n ${cls(x?.["m"+d])}">${x&&x["m"+d]!=null?pct(x["m"+d]):"–"}</td>`).join("")}</tr>`;
  return `<div class="tw"><table><thead><tr><th></th><th class="n">횟수</th><th class="n">5일 승률</th><th class="n">평균</th><th class="n">10일 승률</th><th class="n">평균</th><th class="n">20일 승률</th><th class="n">평균</th></tr></thead>
    <tbody>${row("이 상태",h)}${bl?row(blName||"아무 날 아무 종목",bl):""}</tbody></table></div>
    <p class="note" style="margin:8px 0 0">서로 다른 날짜로는 ${cnt(h.dates)}일. 사고 나서 10일 안에 평균 ${h.mae10??"–"}%까지 물렸고, 나쁜 5%의 경우 10일 뒤 ${h.p5_10??"–"}%였어요. 종가에 사서 종가에 팔고 왕복 비용 ${RU.cost}%를 뺀 숫자예요.</p>`;
}

      <p class="note">악재 스크리닝은 100점에서 감점해요. ${(S.find(s=>s.risk)?.risk.items||[]).map(i=>esc(i.name)).join(", ")}.</p></div>

      <div class="tw"><table><thead><tr><th>출처</th><th class="n">성공</th><th class="n">저장분 대체</th><th class="n">실패</th><th>메모</th></tr></thead><tbody>${health}</tbody></table></div>
      ${(M.notes||[]).length?`<p class="note">${M.notes.map(esc).join("<br>")}</p>`:""}
      <p class="note">평일 장중 30분마다 시세만 새로 받아 갱신하고, 15:45와 18:10에 전부 새로 받아요. 급할 땐 위쪽 '지금 갱신'을 눌러 GitHub에서 Run workflow를 누르면 2~3분 뒤 반영돼요.</p></div>`;
}

/* ── 화면 전환 ── */
const views={home:$("#v-home"),stock:$("#v-stock"),search:$("#v-search"),rules:$("#v-rules")};
function route(){
  const h=(location.hash||"#home").slice(1); let name="home", m;
  if((m=h.match(/^stock-([0-9A-Za-z]{6})(?:-([1-4]))?$/))) name="stock"; else if(h==="search") name="search"; else if(h==="rules") name="rules";
  Object.entries(views).forEach(([k,el])=>el.hidden=(k!==name));
  $("#hero").hidden = name!=="home";
  document.querySelectorAll("[data-nav]").forEach(a=>{ const on=a.dataset.nav===name||(name==="stock"&&a.dataset.nav==="home"); if(on) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current"); });
  if(name==="stock"){ live.length=0; const keep=route._code===m[1]; renderStock(m[1], m[2]?+m[2]:1); if(!keep) window.scrollTo(0,0); else { const y=$(".steps").getBoundingClientRect().top+window.scrollY-70; if(window.scrollY>y) window.scrollTo(0,y); } route._code=m[1]; } else route._code=null;
  if(name==="rules"){ renderRules(); window.scrollTo(0,0); }
  if(name==="search"){ renderSearch(); }
  if(name==="home"){ drawSpark(); }
}
window.addEventListener("hashchange",route);
$("#sq").addEventListener("input",renderSearch);
$("#sRows").addEventListener("click",e=>{ const b=e.target.closest(".card"); if(b) location.hash="stock-"+b.dataset.code;});

header(); marketSection(); bindList(); renderList();
$("#foot").innerHTML=`버거대왕의 국장 레이더 · ${esc(M.generated||"")} 생성 · 데이터: 네이버 금융, 와이즈리포트, DART · 공부용 자동 분석이며 투자 권유가 아닙니다.`;
route();
})();
</script>
