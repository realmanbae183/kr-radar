name: kr-radar

on:
  schedule:
    - cron: "10 9 * * 1-5"
  workflow_dispatch:
    inputs:
      diagnose:
        description: "데이터 출처 점검만 하기 (첫 실행 때 체크)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: kr-radar
  cancel-in-progress: false

defaults:
  run:
    working-directory: kr-radar/kr-radar

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: kr-radar/kr-radar/requirements.txt
      - run: pip install -r requirements.txt
      - name: 검증 테스트
        run: python -m pytest -q tests

      - name: 데이터 출처 점검
        if: ${{ inputs.diagnose }}
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python run.py --diagnose

      - name: 350종목 레이팅
        if: ${{ !inputs.diagnose }}
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python run.py

      - name: 어제 시그널 목록 저장
        if: ${{ !inputs.diagnose }}
        run: |
          git config user.name "kr-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/
          git diff --cached --quiet || git commit -m "state: $(date -u +%F) 시그널 목록"
          git push

      - uses: actions/upload-pages-artifact@v3
        if: ${{ !inputs.diagnose }}
        with:
          path: kr-radar/kr-radar/site
      - id: deploy
        if: ${{ !inputs.diagnose }}
        uses: actions/deploy-pages@v4
