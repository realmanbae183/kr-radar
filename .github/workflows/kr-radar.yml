# 버거대왕 국장 레이더 — 평일 하루 5번
#   10:00 · 12:00 · 14:00  장중 가벼운 실행 (시세만 새로, 알림 없음)
#   15:30 · 18:10          정식 실행 (전부 새로, 텔레그램 알림)
# GitHub 시간은 UTC(한국 -9시간)라서 아래 숫자가 9시간 빠르게 적혀 있어요.
name: kr-radar

on:
  schedule:
    - cron: "0 1 * * 1-5"      # 10:00
    - cron: "0 3 * * 1-5"      # 12:00
    - cron: "0 5 * * 1-5"      # 14:00
    - cron: "30 6 * * 1-5"     # 15:30
    - cron: "10 9 * * 1-5"     # 18:10
  workflow_dispatch:
    inputs:
      mode:
        description: "실행 종류"
        type: choice
        options: [정식, 장중, 점검]
        default: 정식

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: kr-radar
  cancel-in-progress: false

env:
  APP: kr-radar/kr-radar          # 코드가 들어 있는 폴더

defaults:
  run:
    working-directory: kr-radar/kr-radar

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: kr-radar/kr-radar/requirements.txt
      - run: pip install -r requirements.txt

      - name: 실행 종류 정하기
        id: mode
        run: |
          M="full"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            case "${{ github.event.schedule }}" in
              "0 1 * * 1-5"|"0 3 * * 1-5"|"0 5 * * 1-5") M="intraday" ;;
            esac
          else
            case "${{ inputs.mode }}" in
              장중) M="intraday" ;;
              점검) M="diagnose" ;;
            esac
          fi
          echo "mode=$M" >> "$GITHUB_OUTPUT"
          echo "실행 종류: $M"

      - name: 검증 테스트
        run: python -m pytest -q tests

      - name: 저장분(재무·수급·공시) 불러오기
        uses: actions/cache@v4
        with:
          path: kr-radar/kr-radar/cache
          key: kr-fund-${{ github.run_id }}
          restore-keys: kr-fund-

      - name: 데이터 출처 원본 저장 (고칠 때 참고용)
        if: steps.mode.outputs.mode != 'intraday'
        continue-on-error: true
        run: python run.py --probe > /dev/null

      - name: 데이터 출처 점검
        if: steps.mode.outputs.mode == 'diagnose'
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python run.py --diagnose

      - name: 장중 가벼운 실행
        if: steps.mode.outputs.mode == 'intraday'
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python run.py --intraday

      - name: 정식 실행 (350종목)
        if: steps.mode.outputs.mode == 'full'
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python run.py

      - name: 기록 저장 (시그널 목록·원본 응답)
        if: steps.mode.outputs.mode != 'intraday'
        run: |
          git config user.name "kr-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/
          if ! git diff --cached --quiet; then
            git commit -m "state: $(TZ=Asia/Seoul date +'%F %H:%M') ${{ steps.mode.outputs.mode }}"
            git pull --rebase --autostash || true
            git push
          fi

      - uses: actions/upload-pages-artifact@v3
        if: steps.mode.outputs.mode != 'diagnose'
        with:
          path: kr-radar/kr-radar/site
      - id: deploy
        if: steps.mode.outputs.mode != 'diagnose'
        uses: actions/deploy-pages@v4
